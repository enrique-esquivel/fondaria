# Task 11.1 -- the Collector every service exports OTLP to. Applications must
# not know about Prometheus, Tempo or Loki directly (phase-11-observability.md
# Task 11.1's own requirement); this file is the one place that fan-out to
# those three backends is named. No service is instrumented yet (that is Task
# 11.2) -- the pipelines below are wired and ready, and the Collector's own
# self-telemetry (below, port 8888 -- scraped by Prometheus job
# "otel-collector-self") is what proves the wiring works before any
# application sends it a span, metric or log.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # Fan-out #1: metrics. Turns received OTLP metrics into a Prometheus scrape
  # target -- the Collector never pushes to Prometheus, Prometheus pulls from
  # here (prometheus/scrape-config.yml job "otel-collector-app").
  prometheus:
    endpoint: 0.0.0.0:8889

  # Fan-out #2: traces, over OTLP again -- Tempo's own ingest is OTLP-native,
  # so no format translation happens here at all. `otlp_grpc`, not the `otlp`
  # alias: 0.160.0 logs the alias as deprecated on startup.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Fan-out #3: logs, over Loki's native OTLP ingestion endpoint (Loki >=3.0 --
  # this stack pins grafana/loki:3.7.7, see docker-compose.yml). The old
  # contrib `loki` exporter is deprecated in favor of this. `otlp_http`, not
  # the `otlphttp` alias, same reason as above.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  # The Collector's own metrics about itself (spans/metrics/logs received and
  # exported, queue depth, refused points) are always exposed here regardless
  # of the pipelines below -- Prometheus job "otel-collector-self" scrapes
  # this port, and it is what has live data from second one of `up`.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      exporters: [otlp_http/loki]
