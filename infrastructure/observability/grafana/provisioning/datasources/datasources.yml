# Task 11.1. Datasources provisioned from this file, never added by hand in
# the UI -- a `down -v` wipes Grafana's own sqlite state (grafana.db), and a
# datasource that only existed there would not come back.
#
# Each carries an explicit `uid:` (dashboards/collector-health.json binds its
# panels to these, not to the datasource name) -- without it Grafana assigns
# a random uid on every fresh provision, which resolves in the UI via a
# name-fallback but 404s on the server-side query/alerting paths that only
# ever look up by uid.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
