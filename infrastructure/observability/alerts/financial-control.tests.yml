# Task 11.4 & 11F.1 -- promtool unit tests for financial control and SLO alerts.
#
# Verifies:
# 1. Normal day baseline: alert count during a normal day is ZERO.
# 2. Broker-based idle discrimination: high ledger_cdc_lag_seconds does NOT fire when queue is empty.
# 3. Each alert fires under its injected fault:
#    - CDCLagWarning
#    - CDCLagPage
#    - ProjectionDrift (positive and negative drift)
#    - EODHashChainInvalid
#    - DLQMessagesPresent
#    - IdempotencyConflictSpike
#    - PaymentInitiationLatencyBudgetBurn
#    - BalanceReadLatencyBudgetBurn
#    - CDCLagSLOBudgetBurn
#    - PlatformAvailabilityBudgetBurn
#    - PostgresBackupAgeTooHigh
#    - RabbitMqScrapeMissing
#    - ServiceDownProjectionWorker

rule_files:
  - financial-control.rules.yml

evaluation_interval: 1m

tests:
  # --- 1. Normal day baseline: all metrics healthy -> zero alerts fire -------------------
  - interval: 1m
    input_series:
      - series: 'projection_drift_minor'
        values: '0x20'
      - series: 'eod_hash_chain_valid'
        values: '1x20'
      - series: 'rabbitmq_detailed_queue_messages{vhost="/", queue="ledger.entries.dlq"}'
        values: '0x20'
      - series: 'rabbitmq_detailed_queue_messages{vhost="/", queue="projection.entries.v1.1"}'
        values: '0x20'
      - series: 'idempotency_conflict_total'
        values: '0x20'
      - series: 'break_glass_active_count'
        values: '0x20'
      # Pipeline is idle: time moves on, so raw lag grows, but queue depth is 0
      - series: 'ledger_cdc_lag_seconds{group="projection.v1"}'
        values: '10 20 40 80 120 200 350 400 450 500 550 600 650 700 750 800 850 900 950 1000'
      # All services emitting JVM metrics
      - series: 'jvm_memory_used_bytes{job="projection-worker"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="amqp-fanout"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="eod-job"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="contribution-api"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="balance-api"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="valuation-api"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="allotment-job"}'
        values: '100000000x20'
      - series: 'jvm_memory_used_bytes{job="statement-worker"}'
        values: '100000000x20'
      # HTTP traffic is 100% successful and well within latency bounds
      - series: 'http_server_requests_milliseconds_count{status="200"}'
        values: '100+50x20'
      - series: 'http_server_requests_milliseconds_count{job="contribution-api", uri="/v1/organizations/{organizationId}/cash-receipts", status="200"}'
        values: '100+50x20'
      - series: 'http_server_requests_milliseconds_bucket{job="contribution-api", uri="/v1/organizations/{organizationId}/cash-receipts", le="250"}'
        values: '100+50x20'
      - series: 'http_server_requests_milliseconds_count{job="balance-api", uri="/v1/participants/{participantId}/balance", status="200"}'
        values: '100+50x20'
      - series: 'http_server_requests_milliseconds_bucket{job="balance-api", uri="/v1/participants/{participantId}/balance", le="50"}'
        values: '100+50x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CDCLagWarning
        exp_alerts: []
      - eval_time: 15m
        alertname: CDCLagPage
        exp_alerts: []
      - eval_time: 15m
        alertname: ProjectionDrift
        exp_alerts: []
      - eval_time: 15m
        alertname: EODHashChainInvalid
        exp_alerts: []
      - eval_time: 15m
        alertname: DLQMessagesPresent
        exp_alerts: []
      - eval_time: 15m
        alertname: IdempotencyConflictSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: BreakGlassAccessActive
        exp_alerts: []
      - eval_time: 15m
        alertname: PaymentInitiationLatencyBudgetBurn
        exp_alerts: []
      - eval_time: 15m
        alertname: BalanceReadLatencyBudgetBurn
        exp_alerts: []
      - eval_time: 15m
        alertname: CDCLagSLOBudgetBurn
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 15m
        alertname: RabbitMqScrapeMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceDownProjectionWorker
        exp_alerts: []

  # --- 2. CDC Lag: Warning and Page under active pipeline lag ---------------------------
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.1"}'
        values: '10x25'
      - series: 'ledger_cdc_lag_seconds{group="projection.v1"}'
        values: '0 10 20 35 45 60 120 180 240 310 320 350x14'
    alert_rule_test:
      # At 2m: lag is 20s (< 30s) -> no warning
      - eval_time: 2m
        alertname: CDCLagWarning
        exp_alerts: []
      # At 4m: lag has been > 30s for > 30s -> CDCLagWarning fires
      - eval_time: 4m
        alertname: CDCLagWarning
        exp_alerts:
          - exp_labels:
              alertname: CDCLagWarning
              severity: warning
              group: projection.v1
            exp_annotations:
              summary: "CDC projection consumer lag is elevated (> 30s) while events are pending"
              description: "ledger_cdc_lag_seconds exceeds 30s and new events have been received in RabbitMQ queues. The projection pipeline is falling behind real-time. Check projection-worker logs and consumer throughput."
              runbook_url: "docs/RUNBOOKS.md#slo-cdc-lag"
      # At 8m: lag is 180s (< 300s) -> no page yet
      - eval_time: 8m
        alertname: CDCLagPage
        exp_alerts: []
      # At 11m: lag has been > 300s for >= 1m -> CDCLagPage fires
      - eval_time: 11m
        alertname: CDCLagPage
        exp_alerts:
          - exp_labels:
              alertname: CDCLagPage
              severity: page
              group: projection.v1
            exp_annotations:
              summary: "CDC projection pipeline is severely stalled (> 300s) with pending events"
              description: "ledger_cdc_lag_seconds exceeds 300s and incoming ledger events are pending in RabbitMQ. The projection worker has stalled, crashed, or encountered poison messages. Projection is materially stale; inspect worker readiness probe and consider replay."
              runbook_url: "docs/RUNBOOKS.md#cdc-replay"

  # --- 3. Projection Drift: any non-zero drift (positive or negative) pages -------------
  - interval: 1m
    input_series:
      - series: 'projection_drift_minor'
        values: '0 0 -500 0 1200'
    alert_rule_test:
      - eval_time: 1m
        alertname: ProjectionDrift
        exp_alerts: []
      # Negative drift (deficit) fires page immediately
      - eval_time: 2m
        alertname: ProjectionDrift
        exp_alerts:
          - exp_labels:
              alertname: ProjectionDrift
              severity: page
            exp_annotations:
              summary: "Financial balance drift detected between ledger and projection"
              description: "projection_drift_minor is non-zero. The projection store balance differs from TigerBeetle's authoritative ledger. Participants may see inaccurate balances. Investigate immediately."
              runbook_url: "docs/RUNBOOKS.md#projection-drift"
      - eval_time: 3m
        alertname: ProjectionDrift
        exp_alerts: []
      # Positive drift (surplus) fires page immediately
      - eval_time: 4m
        alertname: ProjectionDrift
        exp_alerts:
          - exp_labels:
              alertname: ProjectionDrift
              severity: page
            exp_annotations:
              summary: "Financial balance drift detected between ledger and projection"
              description: "projection_drift_minor is non-zero. The projection store balance differs from TigerBeetle's authoritative ledger. Participants may see inaccurate balances. Investigate immediately."
              runbook_url: "docs/RUNBOOKS.md#projection-drift"

  # --- 4. EOD Hash Chain Invalid: 0 pages immediately -----------------------------------
  - interval: 1m
    input_series:
      - series: 'eod_hash_chain_valid'
        values: '1 1 0 0 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: EODHashChainInvalid
        exp_alerts: []
      - eval_time: 2m
        alertname: EODHashChainInvalid
        exp_alerts:
          - exp_labels:
              alertname: EODHashChainInvalid
              severity: page
            exp_annotations:
              summary: "End-of-day reconciliation cryptographic hash chain verification failed"
              description: "eod_hash_chain_valid is 0. The daily close SHA-256 cryptographic hash chain has detected corruption or record alteration. Audit integrity is broken; halt close operations."
              runbook_url: "docs/RUNBOOKS.md#eod-hash-chain"

  # --- 5. DLQ Messages Present: > 0 pages immediately -----------------------------------
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{vhost="/", queue="ledger.entries.dlq"}'
        values: '0 0 3 5 0'
      - series: 'rabbitmq_detailed_queue_messages{vhost="/", queue="statement.jobs.dlq"}'
        values: '0 0 1 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: DLQMessagesPresent
        exp_alerts: []
      - eval_time: 2m
        alertname: DLQMessagesPresent
        exp_alerts:
          - exp_labels:
              alertname: DLQMessagesPresent
              severity: page
            exp_annotations:
              summary: "Dead-letter queue has unprocessed poison or rejected messages"
              description: "dlq_depth is greater than zero. Financial events failed parsing, schema validation, or projection and were sent to the DLQ. A financial movement has not been recorded in PostgreSQL."
              runbook_url: "docs/RUNBOOKS.md#dead-letter-queue"
      - eval_time: 4m
        alertname: DLQMessagesPresent
        exp_alerts: []

  # --- 6. Idempotency Conflict Spike: warnings after sustained conflict rate ------------
  - interval: 1m
    input_series:
      - series: 'idempotency_conflict_total'
        values: '0 0 0 5 10 15 20 25 30'
    alert_rule_test:
      - eval_time: 2m
        alertname: IdempotencyConflictSpike
        exp_alerts: []
      - eval_time: 8m
        alertname: IdempotencyConflictSpike
        exp_alerts:
          - exp_labels:
              alertname: IdempotencyConflictSpike
              severity: warning
            exp_annotations:
              summary: "Elevated idempotency conflict rate detected on incoming requests"
              description: "idempotency_conflict_total is rising. External clients or batch jobs are resubmitting duplicate idempotency keys with different payloads. Identify calling client and investigate integration."
              runbook_url: "docs/RUNBOOKS.md#idempotency-conflicts"

  # --- 6b. Break Glass Access Active: > 0 pages immediately (Task 9.4) ------------------
  - interval: 1m
    input_series:
      - series: 'break_glass_active_count'
        values: '0 0 1 1 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: BreakGlassAccessActive
        exp_alerts: []
      - eval_time: 2m
        alertname: BreakGlassAccessActive
        exp_alerts:
          - exp_labels:
              alertname: BreakGlassAccessActive
              severity: page
            exp_annotations:
              summary: "Break-glass emergency access is active"
              description: "break_glass_active_count is greater than zero. A privileged staff action was requested or executed using emergency break-glass procedure, bypassing dual approval. Review reason and control totals immediately."
              runbook_url: "docs/RUNBOOKS.md#break-glass"
      - eval_time: 4m
        alertname: BreakGlassAccessActive
        exp_alerts: []

  # --- 7. Payment Initiation Latency SLO: > 1% exceeding 250ms for 5m fires page ---------
  - interval: 1m
    input_series:
      - series: 'http_server_requests_milliseconds_bucket{job="contribution-api", uri="/v1/organizations/{organizationId}/cash-receipts", le="250"}'
        values: '100+10x15'
      - series: 'http_server_requests_milliseconds_count{job="contribution-api", uri="/v1/organizations/{organizationId}/cash-receipts"}'
        values: '100+50x15'
    alert_rule_test:
      # 10 out of 50 requests <= 250ms -> 80% > 250ms (> 1%)
      - eval_time: 4m
        alertname: PaymentInitiationLatencyBudgetBurn
        exp_alerts: []
      # At 7m: condition sustained for > 5m -> alert fires
      - eval_time: 7m
        alertname: PaymentInitiationLatencyBudgetBurn
        exp_alerts:
          - exp_labels:
              alertname: PaymentInitiationLatencyBudgetBurn
              severity: page
            exp_annotations:
              summary: "Payment initiation latency p99 exceeds SLO threshold (250ms)"
              description: "More than 1% of payment initiations exceed 250ms over the last 5m. The payment initiation error budget is burning rapidly. Downstream ledger calls, database writes, or thread exhaustion may be occurring."
              runbook_url: "docs/RUNBOOKS.md#slo-payment-latency"

  # --- 8. Balance Read Latency SLO: > 1% exceeding 50ms for 5m fires warning -----------
  - interval: 1m
    input_series:
      - series: 'http_server_requests_milliseconds_bucket{job="balance-api", uri="/v1/participants/{participantId}/balance", le="50"}'
        values: '100+10x15'
      - series: 'http_server_requests_milliseconds_count{job="balance-api", uri="/v1/participants/{participantId}/balance"}'
        values: '100+50x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: BalanceReadLatencyBudgetBurn
        exp_alerts: []
      - eval_time: 7m
        alertname: BalanceReadLatencyBudgetBurn
        exp_alerts:
          - exp_labels:
              alertname: BalanceReadLatencyBudgetBurn
              severity: warning
            exp_annotations:
              summary: "Balance read latency p99 exceeds SLO threshold (50ms)"
              description: "More than 1% of balance reads exceed 50ms over the last 5m. Participant queries and portal lookups are degraded. Check Redis cache hit ratio and PostgreSQL query performance."
              runbook_url: "docs/RUNBOOKS.md#slo-balance-latency"

  # --- 9. CDC Lag SLO: p99 > 5s while active for 5m fires warning -----------------------
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.1"}'
        values: '10x15'
      - series: 'ledger_cdc_lag_seconds{group="projection.v1"}'
        values: '0 8x14'
    alert_rule_test:
      - eval_time: 4m
        alertname: CDCLagSLOBudgetBurn
        exp_alerts: []
      - eval_time: 7m
        alertname: CDCLagSLOBudgetBurn
        exp_alerts:
          - exp_labels:
              alertname: CDCLagSLOBudgetBurn
              severity: warning
              group: projection.v1
            exp_annotations:
              summary: "CDC projection lag p99 exceeds SLO threshold (5s)"
              description: "CDC lag has exceeded the 5s SLO target for 5m while events are waiting to be processed. The pipeline is running behind commitments. Check worker concurrency and broker consumer lag."
              runbook_url: "docs/RUNBOOKS.md#slo-cdc-lag"

  # --- 10. Availability SLO: 5xx error rate > 0.05% for 5m fires page ------------------
  - interval: 1m
    input_series:
      - series: 'http_server_requests_milliseconds_count{status="200"}'
        values: '1000+1000x15'
      - series: 'http_server_requests_milliseconds_count{status="500"}'
        values: '0+10x15'
    alert_rule_test:
      # Error rate is 10 / 1010 ≈ 0.99% > 0.05%
      - eval_time: 4m
        alertname: PlatformAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 7m
        alertname: PlatformAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              alertname: PlatformAvailabilityBudgetBurn
              severity: page
            exp_annotations:
              summary: "Platform availability is below the 99.95% SLO threshold"
              description: "5xx HTTP error rate exceeds the 0.05% error budget over the last 5m. Service availability target (99.95%) is breached. Check service health, unhandled exceptions, and upstream dependencies."
              runbook_url: "docs/RUNBOOKS.md#slo-availability"

  # --- 11. PostgreSQL backup age > 24h fires page ---------------------------------------
  - interval: 1m
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp'
        values: '0x1550'
    alert_rule_test:
      - eval_time: 1440m
        alertname: PostgresBackupAgeTooHigh
        exp_alerts: []
      - eval_time: 1456m
        alertname: PostgresBackupAgeTooHigh
        exp_alerts:
          - exp_labels:
              alertname: PostgresBackupAgeTooHigh
              severity: page
            exp_annotations:
              summary: "PostgreSQL continuous backup is stale (> 24h since last successful backup)"
              description: "cnpg_collector_last_available_backup_timestamp is more than 24 hours in the past. Scheduled daily backups or continuous WAL archiving may be failing. RPO is at severe risk; inspect CloudNativePG operator logs, barmanObjectStore status, and object store (S3 API) connectivity."
              runbook_url: "docs/RUNBOOKS.md#postgres-backup-age"

  # --- 12. RabbitMQ scrape missing for 5m fires page ------------------------------------
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: RabbitMqScrapeMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: RabbitMqScrapeMissing
        exp_alerts:
          - exp_labels:
              alertname: RabbitMqScrapeMissing
              severity: page
            exp_annotations:
              summary: "RabbitMQ metrics scrape is missing or failing"
              description: "rabbitmq_detailed_queue_messages is absent. Prometheus is unable to scrape RabbitMQ metrics endpoint on port 15692. DLQ depth and queue backlog monitoring is blind."
              runbook_url: "docs/RUNBOOKS.md#dead-letter-queue"

  # --- 13. Service down (absent JVM metrics for 5m) fires alert --------------------------
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: ServiceDownProjectionWorker
        exp_alerts: []
      - eval_time: 6m
        alertname: ServiceDownProjectionWorker
        exp_alerts:
          - exp_labels:
              alertname: ServiceDownProjectionWorker
              job: projection-worker
              severity: page
            exp_annotations:
              summary: "Service projection-worker is down or not emitting metrics"
              description: "jvm_memory_used_bytes{job=\"projection-worker\"} is absent for 5m. The projection worker process has stopped exporting metrics. CDC ledger projection is halted."
              runbook_url: "docs/RUNBOOKS.md#cdc-replay"

  # --- 14. Two pods, one lagging: max() across pods raises ONE page (ADR-0032 §4) --------
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.1"}'
        values: '10x15'
      - series: 'ledger_cdc_lag_seconds{group="projection.v1", instance="projection-worker-a"}'
        values: '0x15'
      - series: 'ledger_cdc_lag_seconds{group="projection.v1", instance="projection-worker-b"}'
        values: '400x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CDCLagPage
        exp_alerts:
          - exp_labels:
              alertname: CDCLagPage
              severity: page
              group: projection.v1
            exp_annotations:
              summary: "CDC projection pipeline is severely stalled (> 300s) with pending events"
              description: "ledger_cdc_lag_seconds exceeds 300s and incoming ledger events are pending in RabbitMQ. The projection worker has stalled, crashed, or encountered poison messages. Projection is materially stale; inspect worker readiness probe and consider replay."
              runbook_url: "docs/RUNBOOKS.md#cdc-replay"

  # --- 15. Two pods, both under the threshold: nothing fires -----------------------------
  - interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.1"}'
        values: '10x15'
      - series: 'ledger_cdc_lag_seconds{group="projection.v1", instance="projection-worker-a"}'
        values: '2x15'
      - series: 'ledger_cdc_lag_seconds{group="projection.v1", instance="projection-worker-b"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CDCLagWarning
        exp_alerts: []
      - eval_time: 10m
        alertname: CDCLagSLOBudgetBurn
        exp_alerts: []

  # --- 16. Cluster halt: any pod at 1 pages once (ADR-0032 §2/§4) ------------------------
  - interval: 1m
    input_series:
      - series: 'projection_halted{instance="projection-worker-a"}'
        values: '0 0 1 1 1 0'
      - series: 'projection_halted{instance="projection-worker-b"}'
        values: '0 0 0 1 1 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: ProjectionHalted
        exp_alerts: []
      # One pod has tripped and the other has not seen the flag yet: already one page.
      - eval_time: 2m
        alertname: ProjectionHalted
        exp_alerts:
          - exp_labels:
              alertname: ProjectionHalted
              severity: page
            exp_annotations:
              summary: "The projection worker is halted on a message it could not process"
              description: "projection_halted is 1 on at least one projection-worker pod. A poison message was dead-lettered and the cluster-wide halt flag (workflow.projection_halt) stops every replica. Nothing new is being projected, so balances and statements read from the projection are going stale. Find the active halt row, fix the cause, then clear it and restart per the runbook."
              runbook_url: "docs/RUNBOOKS.md#cdc-replay"
      # Both pods halted: still one alert, not two.
      - eval_time: 3m
        alertname: ProjectionHalted
        exp_alerts:
          - exp_labels:
              alertname: ProjectionHalted
              severity: page
            exp_annotations:
              summary: "The projection worker is halted on a message it could not process"
              description: "projection_halted is 1 on at least one projection-worker pod. A poison message was dead-lettered and the cluster-wide halt flag (workflow.projection_halt) stops every replica. Nothing new is being projected, so balances and statements read from the projection are going stale. Find the active halt row, fix the cause, then clear it and restart per the runbook."
              runbook_url: "docs/RUNBOOKS.md#cdc-replay"
      - eval_time: 5m
        alertname: ProjectionHalted
        exp_alerts: []

  # --- 17. A queue that holds messages and is not shrinking warns; a draining one does not
  - interval: 1m
    input_series:
      # stuck: never falls
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.12"}'
        values: '100x30'
      # draining: falls every minute
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.3"}'
        values: '900-10x30'
      # caught up
      - series: 'rabbitmq_detailed_queue_messages{queue="projection.entries.v1.4"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: ProjectionQueueNotDraining
        exp_alerts: []
      # Only the stuck queue, at 8m (`for: 5m` elapsed) and still at 20m. The draining and the
      # empty queue never appear. (A series younger than the 10m window is judged on the samples
      # it has, so the alert can fire a little early right after a queue first appears.)
      - eval_time: 8m
        alertname: ProjectionQueueNotDraining
        exp_alerts:
          - exp_labels:
              alertname: ProjectionQueueNotDraining
              severity: warning
              queue: projection.entries.v1.12
            exp_annotations:
              summary: "A projection queue has held messages for 10 minutes without shrinking"
              description: "rabbitmq_detailed_queue_messages for a projection queue has been non-zero and has not fallen for 10m. Consumers on that queue are stuck, starved of database connections, or the worker is halted. Check projection_halted, the pool size against consumers, and worker logs."
              runbook_url: "docs/RUNBOOKS.md#slo-cdc-lag"
      - eval_time: 20m
        alertname: ProjectionQueueNotDraining
        exp_alerts:
          - exp_labels:
              alertname: ProjectionQueueNotDraining
              severity: warning
              queue: projection.entries.v1.12
            exp_annotations:
              summary: "A projection queue has held messages for 10 minutes without shrinking"
              description: "rabbitmq_detailed_queue_messages for a projection queue has been non-zero and has not fallen for 10m. Consumers on that queue are stuck, starved of database connections, or the worker is halted. Check projection_halted, the pool size against consumers, and worker logs."
              runbook_url: "docs/RUNBOOKS.md#slo-cdc-lag"
