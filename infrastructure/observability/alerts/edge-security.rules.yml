# Task 10.2 (phase-10-edge.md) -- "JWKS unreachable -> fail closed and alert" is the task's own
# acceptance criterion. Fail-closed itself needs no code: Envoy's jwt_authn filter has no key to
# verify against until its first successful JWKS fetch, and rejects every request needing that
# provider until then (source/extensions/filters/http/jwt_authn, verified this session against a
# live Envoy Gateway 1.3.0 instance -- see TASK-LOG.md). This file is the other half: the alert.
#
# `envoy_http_jwt_authn_jwks_fetch_failed` is not a Micrometer/OTel metric this platform emits --
# it is Envoy's own jwt_authn filter counter (ALL_JWT_AUTHN_FILTER_STATS,
# source/extensions/filters/http/jwt_authn/stats.h), exposed by Envoy's built-in /stats/prometheus
# endpoint and scraped by infrastructure/k8s/base/observability/prometheus/configmap.yaml's
# `envoy-gateway.yml` job. Confirmed against the real metric name and label this session (a fresh
# proxy pod logged one transient jwks_fetch_failed during its first async pre-fetch race, before
# xDS config had converged, then four consecutive jwks_fetch_success) -- the `> 3` threshold below
# is chosen specifically so that a single, ordinary startup blip like the one just observed does
# not page, while Envoy's fast retry (JwksAsyncFetch's default 1s failed-refetch interval) means a
# genuine, sustained JWKS outage racks up far more than three failures inside the window.
#
# severity: page, matching AGENTS.md Sec 7 and Task 11.4's own bar: an unreachable JWKS is not a
# capacity or latency problem, it is every application route this policy protects going dark
# (fail-closed means 401 for everyone, not just forged tokens) until Keycloak or the network path
# to it is restored.
groups:
  - name: edge-security
    rules:
      - alert: EdgeJwksFetchFailing
        expr: increase(envoy_http_jwt_authn_jwks_fetch_failed[5m]) > 3
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "The edge gateway cannot fetch Keycloak's signing keys -- every protected route is failing closed."
          description: "envoy_http_jwt_authn_jwks_fetch_failed has increased more than 3 times in 5m. Envoy's jwt_authn filter (securitypolicy-jwt.yaml) has no valid, current key set and is rejecting every request to the participant and employer APIs with 401, correctly (Task 10.2's fail-closed posture) but indiscriminately -- this is not limited to forged tokens. Check Keycloak's own health and the in-cluster path to keycloak.fondaria.svc.cluster.local:8080."
          runbook_url: "docs/RUNBOOKS.md#jwks-outage"
