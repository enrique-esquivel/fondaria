# Task 10.3 (phase-10-edge.md): turns on Envoy Gateway's Redis-backed Global
# rate limiting. This is the controller's own install-time configuration --
# a ConfigMap in envoy-gateway-system, read once at startup, not a resource
# any BackendTrafficPolicy or this repo's overlays/{local,prod} split can
# reach (that split governs infrastructure/k8s/base, applied into the
# `fondaria` namespace; this lives beside kind-config.yaml because, like it,
# it is local-only cluster bootstrap, never a workload). A full replacement
# of the ConfigMap the pinned install.yaml creates, not a kubectl patch:
# `data.envoy-gateway.yaml` is one opaque multi-line string from the
# Kubernetes API's own point of view, so a JSON/strategic-merge patch cannot
# add one key inside it -- applying the whole file the same way
# bootstrap/up.sh already applies every other pinned manifest is what stays
# legible and idempotent. Content verified against the actual v1.3.0
# install.yaml (github.com/envoyproxy/gateway/releases/download/v1.3.0/
# install.yaml) rather than assumed: the `gateway`, `logging` and
# `provider.kubernetes.{rateLimitDeployment,shutdownManager}` fields below
# are copied verbatim from what that manifest already ships, so replacing it
# changes only the added `rateLimit` block.
#
# Backend is this cluster's own Valkey (infrastructure/k8s/base/valkey/),
# addressed by its in-cluster Service DNS name -- no new dependency, per
# AGENTS.md ("No new dependency unless the task names it").
# `funds_dev_pass` is the same local-dev-only default already committed in
# overlays/local/kustomization.yaml's `valkey-credentials` secretGenerator;
# this file is bootstrap/-only tooling (kind, local development), so it
# carries the same class of committed dev default that file does. There is
# no equivalent for prod yet: prod's Valkey password comes from an
# ExternalSecret this bootstrap script never runs against (it targets a kind
# cluster only), so configuring this backend for a real cluster is a
# separate, unbuilt operational step -- flagged, not solved here, the same
# way this repo already leaves other local-vs-prod gaps (e.g. the TLS
# certificate story in overlays/prod/certificates.yaml's own header).
#
# failClosed: false (the field's zero value, set explicitly so it reads as a
# decision) -- a Redis/Valkey outage degrades to unlimited traffic rather
# than rejecting every request. Matches this platform's own existing
# precedent for every other Valkey consumer (infrastructure/k8s/base/valkey/
# valkey-cluster.yaml: "each of them treats an outage as a cache miss, never
# a fault"); rate limiting is an abuse control, not a money-correctness
# control (AGENTS.md's "correctness of participants' money outranks
# everything" governs the ledger and NAV, not this), so losing it
# temporarily is the smaller cost next to an availability outage over a
# cache dependency. Verified live this session (TASK-LOG.md): scaling Valkey
# to zero left requests succeeding past what would otherwise have been a
# rate-limited 429.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/managed-by: fondaria-bootstrap
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      kubernetes:
        rateLimitDeployment:
          container:
            image: docker.io/envoyproxy/ratelimit:60d8e81b
          patch:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    containers:
                    - imagePullPolicy: IfNotPresent
                      name: envoy-ratelimit
        shutdownManager:
          image: envoyproxy/gateway:v1.3.0
      type: Kubernetes
    rateLimit:
      backend:
        type: Redis
        redis:
          url: "redis://:funds_dev_pass@valkey.fondaria.svc.cluster.local:6379"
      timeout: 5s
      failClosed: false
