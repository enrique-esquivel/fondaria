apiVersion: apps/v1
kind: Deployment
metadata:
  name: amqp-fanout
  labels:
    app.kubernetes.io/name: amqp-fanout
    app.kubernetes.io/component: transport
    app.kubernetes.io/part-of: fondaria
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: amqp-fanout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amqp-fanout
        app.kubernetes.io/component: transport
        app.kubernetes.io/part-of: fondaria
      annotations:
        # Task 10.4 (ADR-0029): meshed for uniform default-deny -- nothing
        # calls amqp-fanout over HTTP, so no Server/AuthorizationPolicy names
        # a caller; mesh policy denies every non-probe inbound connection by
        # default. automountServiceAccountToken: false below does not block
        # injection -- verified live.
        linkerd.io/inject: enabled
        # Linkerd's proxy as a native sidecar (an init container with restartPolicy:
        # Always) that starts before the wait-for-* init containers, so their checks
        # carry this workload's mesh identity -- the datastores' AuthorizationPolicies
        # admit nothing else. Injected the classic way, the proxy starts only after
        # every init container, and linkerd-init's iptables rules would send their
        # traffic to a proxy that is not listening yet. Both spellings: the alpha
        # annotation (Linkerd 2.15-2.17) and the beta one that replaced it.
        config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
        config.beta.linkerd.io/proxy-enable-native-sidecar: "true"
    spec:
      priorityClassName: fondaria-stateless-default
      serviceAccountName: amqp-fanout
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: amqp-fanout
      # Startup ordering (ADR-0037): each wait-for-* blocks until one dependency is
      # genuinely usable, using infrastructure/k8s/base/startup-waits/. A dependency
      # that never comes leaves the pod in Init:Error naming it, not Running and idle.
      initContainers:
        - name: wait-for-rabbitmq
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/rabbitmq.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: amqp-fanout-config
                  key: BRIDGE_AMQP_HOST
            - name: RABBITMQ_VHOST
              valueFrom:
                configMapKeyRef:
                  name: amqp-fanout-config
                  key: BRIDGE_AMQP_VHOST
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            # bridge.ledger is declared by the rabbitmq-topology Job; the projection's queues
            # by projection-worker on its first connection. Until those are bound, what this
            # service republishes is confirmed and dropped (an unroutable message is not an
            # error), and the projection never sees it. The tigerbeetle exchange and
            # bridge.ledger are fixed names in rabbitmq/topology-job.yaml's script.
            - name: PROJECTION_TRANSFERS_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_TRANSFERS_EXCHANGE
            - name: PROJECTION_TRANSFERS_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_TRANSFERS_QUEUE
            - name: PROJECTION_ENTRIES_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_ENTRIES_EXCHANGE
            - name: PROJECTION_ENTRIES_QUEUE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_ENTRIES_QUEUE_PREFIX
            - name: PROJECTION_ENTRIES_QUEUE_COUNT
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_ENTRIES_QUEUE_COUNT
            - name: WAIT_RABBITMQ_BINDINGS
              value: "tigerbeetle>bridge.ledger $(PROJECTION_TRANSFERS_EXCHANGE)>$(PROJECTION_TRANSFERS_QUEUE)"
            - name: WAIT_RABBITMQ_SHARDED_BINDING
              value: "$(PROJECTION_ENTRIES_EXCHANGE)>$(PROJECTION_ENTRIES_QUEUE_PREFIX)>$(PROJECTION_ENTRIES_QUEUE_COUNT)"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
      containers:
        - name: amqp-fanout
          image: fondaria/amqp-fanout:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-mgmt
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: amqp-fanout-config
          # Credentials come from the Secrets the operators generate (CloudNativePG's
          # <cluster>-app, the RabbitMQ operator's <cluster>-default-user) and from the
          # platform-level object-store-credentials -- never a per-service secret store entry.
          env:
            - name: BRIDGE_AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: BRIDGE_AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # Startup probe: Spring Boot 3.5 initializes AMQP connection and listener container.
          # Allows up to 60s (30 * 2s) before failing.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          # Liveness probe: Actuator liveness state verifies JVM and message dispatcher health.
          # 3 consecutive failures restart the pod.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness probe: Actuator readiness group -- readinessState and the bridge.ledger
          # listener container (ADR-0037): a container stopped for good takes the pod out of Ready.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-mgmt
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: startup-waits
          configMap:
            name: startup-waits
        - name: startup-wait-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
