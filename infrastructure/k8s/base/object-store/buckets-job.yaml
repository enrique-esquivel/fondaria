apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-buckets
  labels:
    app.kubernetes.io/name: object-store-buckets
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: fondaria
spec:
  # The k8s counterpart of compose's `object-store-buckets` one-shot: the
  # platform never creates a bucket at runtime (ADR-0009), the deployment
  # provisions them. Runs the object store's own image -- its curl signs S3
  # requests (SigV4), so there is no second image to keep pullable (ADR-0031).
  # Idempotent: an existing bucket answers 409 BucketAlreadyExists/OwnedByYou.
  backoffLimit: 20
  # Every call below also carries its own curl timeout (AGENTS.md section 4);
  # this bounds the Job as a whole, retries included.
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-buckets
        app.kubernetes.io/component: object-store
        app.kubernetes.io/part-of: fondaria
    spec:
      restartPolicy: OnFailure
      priorityClassName: fondaria-stateless-default
      serviceAccountName: object-store
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: buckets
          image: docker.io/chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until curl -sf --connect-timeout 5 --max-time 10 -o /dev/null http://object-store:8333/healthz; do
                echo "object-store-buckets: object store not reachable yet; retrying in 3s"
                sleep 3
              done
              for bucket in contribution-files valuation-files eod-snapshots statement-objects postgres-backups; do
                code=$(curl -sS --connect-timeout 5 --max-time 30 -o /tmp/response -w '%{http_code}' --aws-sigv4 "aws:amz:us-east-1:s3" \
                  --user "${OBJECT_STORE_ROOT_ACCESS_KEY}:${OBJECT_STORE_ROOT_SECRET_KEY}" \
                  -X PUT "http://object-store:8333/${bucket}")
                if [ "${code}" = 200 ] || { [ "${code}" = 409 ] && grep -q BucketAlready /tmp/response; }; then
                  echo "object-store-buckets: ${bucket} ready (${code})"
                else
                  echo "object-store-buckets: creating ${bucket} failed (${code})"; cat /tmp/response; exit 1
                fi
              done
              echo "object-store-buckets: done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: object-store-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
