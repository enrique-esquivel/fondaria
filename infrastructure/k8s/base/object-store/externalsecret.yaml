apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: object-store-credentials
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: fondaria
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    # The one object-store credential in the platform: read by the object
    # store itself (as its admin S3 identity, ADR-0031), by every service that
    # touches a bucket (OBJECT_STORE_ACCESS_KEY / _SECRET_KEY via
    # secretKeyRef), by the bucket-provisioning Job, and by CloudNativePG's
    # barmanObjectStore. The local overlay replaces this with a
    # secretGenerator of the same name.
    name: object-store-credentials
    creationPolicy: Owner
  data:
    - secretKey: OBJECT_STORE_ROOT_ACCESS_KEY
      remoteRef:
        key: fondaria/object-store
        property: accessKey
    - secretKey: OBJECT_STORE_ROOT_SECRET_KEY
      remoteRef:
        key: fondaria/object-store
        property: secretKey
