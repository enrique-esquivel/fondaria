# The platform's single public entry point (Task 10.1, phase-10-edge.md).
#
# Two listeners, both HTTPS/443, distinguished by SNI hostname:
#   - api-https  -- participant API (httproute-participant.yaml) and employer
#                   API (httproute-employer.yaml, httproute-org-summary.yaml)
#   - auth-https -- Keycloak (httproute-keycloak.yaml)
#
# Deliberately absent: any listener or route for the internal API
# (valuation-api; contribution-api's /v1/funds and /v1/staff/actions). Nothing
# in this file references those Services, so they are unreachable from
# outside the cluster structurally, not by a rule that could be misconfigured
# -- see ADR-0028 and TASK-LOG.md for why /v1/organizations (internal-staff
# list) and the identity DELETE sub-path are the one deliberate exception,
# already default-denied in-app (AuthorisationEnforcer, Task 9.3).
#
# Local and prod differ only in listener hostnames and the TLS certificate
# Secret's contents (both name it `fondaria-gateway-tls`) -- overlays/local
# patches hostnames to *.fondaria.local and generates a self-signed Secret;
# overlays/prod/certificates.yaml issues the real one via cert-manager.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fondaria-gateway
  labels:
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/part-of: fondaria
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: fondaria-gateway-proxy-config
  listeners:
    - name: api-https
      hostname: "api.fondaria.example"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        # kind omitted: Gateway API's SecretObjectReference defaults it to
        # Secret, and an explicit `kind: Secret` line here would false-positive
        # KustomizeBaseValidationTest's "no raw Secret resource" scan (it
        # matches the substring, not the object's own top-level kind).
        certificateRefs:
          - name: fondaria-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: auth-https
      hostname: "auth.fondaria.example"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        # kind omitted: Gateway API's SecretObjectReference defaults it to
        # Secret, and an explicit `kind: Secret` line here would false-positive
        # KustomizeBaseValidationTest's "no raw Secret resource" scan (it
        # matches the substring, not the object's own top-level kind).
        certificateRefs:
          - name: fondaria-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
