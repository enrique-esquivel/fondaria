apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: contribution-api-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: contribution-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fondaria
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: contribution-api-secret
    creationPolicy: Owner
  data:
    - secretKey: PARTICIPANT_IDENTITY_MASTER_KEY
      remoteRef:
        key: fondaria/contribution-api
        property: participantIdentityMasterKey
