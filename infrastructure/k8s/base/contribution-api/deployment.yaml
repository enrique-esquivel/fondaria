apiVersion: apps/v1
kind: Deployment
metadata:
  name: contribution-api
  labels:
    app.kubernetes.io/name: contribution-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fondaria
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  # ADR-0033: every pod of this Deployment holds one TigerBeetle client connection, and the
  # replica accepts only 32. A rollout's surge pods hold one each too, so the surge is pinned
  # to one pod rather than the 25% default; LedgerClientBudgetValidationTest counts it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: contribution-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contribution-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fondaria
      annotations:
        # Task 10.4 (ADR-0029): mesh mTLS for the edge -> contribution-api
        # call path. automountServiceAccountToken: false below does not
        # block this -- the injector gives its own proxy container a
        # separate projected token volume for identity, verified live.
        linkerd.io/inject: enabled
    spec:
      priorityClassName: fondaria-stateless-default
      serviceAccountName: contribution-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # The TigerBeetle client library uses io_uring for its networking, and the
        # container runtime's default seccomp profile blocks the io_uring_* syscalls
        # (verified: "tb_client_context: failed to initialize IO: PermissionDenied").
        # Same exception as the TigerBeetle StatefulSet and the CDC connector, carved
        # out by name in policy/security-context.rego; a Localhost profile (runtime
        # default + io_uring_*) is the tighter follow-up.
        seccompProfile:
          type: Unconfined
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: contribution-api
      containers:
        - name: contribution-api
          image: fondaria/contribution-api:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: contribution-api-config
          # Most credentials come from the Secrets the operators generate (CloudNativePG's
          # <cluster>-app, the RabbitMQ operator's <cluster>-default-user) and from the
          # platform-level object-store-credentials. PARTICIPANT_IDENTITY_MASTER_KEY (Task 9.5) is the
          # exception: nothing generates it, so it is this service's own ExternalSecret
          # (externalsecret.yaml), the same pattern balance-api's QUERY_CURSOR_SECRET uses.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-credentials
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: OBJECT_STORE_ROOT_ACCESS_KEY
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: OBJECT_STORE_ROOT_SECRET_KEY
            - name: PARTICIPANT_IDENTITY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: contribution-api-secret
                  key: PARTICIPANT_IDENTITY_MASTER_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # Startup probe: Spring Boot 3.5 with virtual threads initializes Flyway migrations,
          # connection pools, and pre-warms caches. Allows up to 60s (30 * 2s) before failing.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          # Liveness probe: Actuator liveness state verifies JVM and internal event loops are healthy.
          # Fails only on deadlocks or hard worker failure. 3 consecutive failures restart the pod.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness probe: Actuator readiness state verifies database, broker, and cache connections
          # are reachable and traffic can be accepted. Removed from Service routing if unhealthy.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
