apiVersion: apps/v1
kind: Deployment
metadata:
  name: allotment-job
  labels:
    app.kubernetes.io/name: allotment-job
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: fondaria
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # ADR-0033: every pod of this Deployment holds one TigerBeetle client connection, and the
  # replica accepts only 32. A rollout's surge pods hold one each too, so the surge is pinned
  # to one pod rather than the 25% default; LedgerClientBudgetValidationTest counts it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: allotment-job
  template:
    metadata:
      labels:
        app.kubernetes.io/name: allotment-job
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: fondaria
      annotations:
        # Task 10.4 (ADR-0029): meshed for uniform default-deny -- nothing
        # calls allotment-job over HTTP, so no Server/AuthorizationPolicy
        # names a caller; mesh policy denies every non-probe inbound
        # connection by default. automountServiceAccountToken: false below
        # does not block injection -- verified live.
        linkerd.io/inject: enabled
    spec:
      priorityClassName: fondaria-stateless-default
      serviceAccountName: allotment-job
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # The TigerBeetle client library uses io_uring for its networking, and the
        # container runtime's default seccomp profile blocks the io_uring_* syscalls
        # (verified: "tb_client_context: failed to initialize IO: PermissionDenied").
        # Same exception as the TigerBeetle StatefulSet and the CDC connector, carved
        # out by name in policy/security-context.rego; a Localhost profile (runtime
        # default + io_uring_*) is the tighter follow-up.
        seccompProfile:
          type: Unconfined
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: allotment-job
      containers:
        - name: allotment-job
          image: fondaria/allotment-job:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-mgmt
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: allotment-job-config
          # Credentials come from the Secrets the operators generate (CloudNativePG's
          # <cluster>-app, the RabbitMQ operator's <cluster>-default-user) and from the
          # platform-level object-store-credentials -- never a per-service secret store entry.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # Startup probe: Spring Boot 3.5 initializes Flyway migrations, rules engine,
          # and database pools. Allows up to 60s (30 * 2s) before failing.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          # Liveness probe: Actuator liveness state verifies JVM and worker threads are healthy.
          # 3 consecutive failures restart the pod.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness probe: Actuator readiness state verifies database, valuation cache,
          # and TigerBeetle connectivity.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-mgmt
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
