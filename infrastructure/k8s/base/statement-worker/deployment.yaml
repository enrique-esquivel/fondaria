apiVersion: apps/v1
kind: Deployment
metadata:
  name: statement-worker
  labels:
    app.kubernetes.io/name: statement-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: fondaria
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: statement-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statement-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: fondaria
      annotations:
        # Task 10.4 (ADR-0029): meshed for uniform default-deny -- nothing
        # calls statement-worker over HTTP, so no Server/AuthorizationPolicy
        # names a caller; mesh policy denies every non-probe inbound
        # connection by default. automountServiceAccountToken: false below
        # does not block injection -- verified live.
        linkerd.io/inject: enabled
        # Linkerd's proxy as a native sidecar (an init container with restartPolicy:
        # Always) that starts before the wait-for-* init containers, so their checks
        # carry this workload's mesh identity -- the datastores' AuthorizationPolicies
        # admit nothing else. Injected the classic way, the proxy starts only after
        # every init container, and linkerd-init's iptables rules would send their
        # traffic to a proxy that is not listening yet. Both spellings: the alpha
        # annotation (Linkerd 2.15-2.17) and the beta one that replaced it.
        config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
        config.beta.linkerd.io/proxy-enable-native-sidecar: "true"
    spec:
      priorityClassName: fondaria-stateless-default
      serviceAccountName: statement-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: statement-worker
      # Startup ordering (ADR-0037): each wait-for-* blocks until one dependency is
      # genuinely usable, using infrastructure/k8s/base/startup-waits/. A dependency
      # that never comes leaves the pod in Init:Error naming it, not Running and idle.
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:17.2@sha256:61d2b391e3e324d05edc6c65c555989a7c544ddb72ef271b3abd4a35b57942b1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/postgres.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: POSTGRES_URL
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
        - name: wait-for-valkey
          image: valkey/valkey@sha256:752ba000a58bc8925d11ee863a39b5225617cd2cb3dbc9ec8ac65268b65ebb6d
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/valkey.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: VALKEY_URL
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: STATEMENT_REDIS_URL
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-credentials
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
        - name: wait-for-rabbitmq
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/rabbitmq.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: STATEMENT_AMQP_HOST
            - name: RABBITMQ_VHOST
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: STATEMENT_AMQP_VHOST
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
        - name: wait-for-object-store
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/object-store.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: OBJECT_STORE_ENDPOINT
            - name: BUCKET_0
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: SNAPSHOT_BUCKET
            - name: BUCKET_1
              valueFrom:
                configMapKeyRef:
                  name: statement-worker-config
                  key: STATEMENT_BUCKET
            - name: WAIT_BUCKETS
              value: "$(BUCKET_0) $(BUCKET_1)"
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: OBJECT_STORE_ROOT_ACCESS_KEY
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: OBJECT_STORE_ROOT_SECRET_KEY
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
      containers:
        - name: statement-worker
          image: fondaria/statement-worker:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-mgmt
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: statement-worker-config
          # Credentials come from the Secrets the operators generate (CloudNativePG's
          # <cluster>-app, the RabbitMQ operator's <cluster>-default-user) and from the
          # platform-level object-store-credentials -- never a per-service secret store entry.
          env:
            - name: STATEMENT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-credentials
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: STATEMENT_AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: STATEMENT_AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: OBJECT_STORE_ROOT_ACCESS_KEY
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: OBJECT_STORE_ROOT_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # Startup probe: Spring Boot 3.5 initializes Flyway schema check, database pool,
          # and AMQP statement job listener. Allows up to 60s (30 * 2s) before failing.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          # Liveness probe: Actuator liveness state verifies JVM and worker listener threads.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness probe: Actuator readiness state verifies database, RabbitMQ, Valkey, and the object store
          # connectivity for statement rendering and object storage upload.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-mgmt
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: startup-waits
          configMap:
            name: startup-waits
        - name: startup-wait-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
