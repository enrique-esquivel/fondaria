apiVersion: v1
kind: ConfigMap
metadata:
  name: statement-worker-config
  labels:
    app.kubernetes.io/name: statement-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: fondaria
data:
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  TOMCAT_BASEDIR: "/tmp/statement-worker"
  POSTGRES_URL: "jdbc:postgresql://postgres-rw:5432/funds?sslmode=disable"
  STATEMENT_AMQP_HOST: "rabbitmq"
  STATEMENT_AMQP_PORT: "5672"
  STATEMENT_AMQP_VHOST: "/"
  STATEMENT_REDIS_URL: "redis://valkey:6379"
  OBJECT_STORE_ENDPOINT: "http://object-store:8333"
  SNAPSHOT_BUCKET: "eod-snapshots"
  STATEMENT_BUCKET: "statement-objects"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  DEMO_CLOCK_ENABLED: "false"
