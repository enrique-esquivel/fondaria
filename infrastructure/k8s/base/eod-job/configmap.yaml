apiVersion: v1
kind: ConfigMap
metadata:
  name: eod-job-config
  labels:
    app.kubernetes.io/name: eod-job
    app.kubernetes.io/component: eod
    app.kubernetes.io/part-of: fondaria
data:
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  TOMCAT_BASEDIR: "/tmp/eod-job"
  POSTGRES_URL: "jdbc:postgresql://postgres-rw:5432/funds?sslmode=disable"
  TIGERBEETLE_ADDRESSES: "10.96.100.100:3000,10.96.100.101:3000,10.96.100.102:3000,10.96.100.103:3000,10.96.100.104:3000,10.96.100.105:3000"
  TIGERBEETLE_CLUSTER_ID: "0"
  LEDGER_ID_NAMESPACE: "00000000-0000-0000-0000-000000000002"
  SIGNOFF_AMQP_HOST: "rabbitmq"
  SIGNOFF_AMQP_PORT: "5672"
  SIGNOFF_AMQP_VHOST: "/"
  OBJECT_STORE_ENDPOINT: "http://object-store:8333"
  SNAPSHOT_BUCKET: "eod-snapshots"
  CALENDAR_ZONE: "America/Mexico_City"
  CALENDAR_CUTOFF_TIME: "18:00"
  # Empty: no close window, every close sweep runs on every tick (CloseWindow).
  # Only the demo overlays set it.
  CLOSE_WINDOW_START: ""
  # ADR-0038: skip a reconciliation pass while the projection is behind the
  # ledger head; run it anyway once no consumer has advanced for STALL_AFTER.
  RECONCILIATION_CATCH_UP_QUIET_PERIOD: "15s"
  RECONCILIATION_CATCH_UP_STALL_AFTER: "2m"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  DEMO_CLOCK_ENABLED: "false"
