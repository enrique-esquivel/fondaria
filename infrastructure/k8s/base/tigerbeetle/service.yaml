apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  labels:
    app.kubernetes.io/name: tigerbeetle
    app.kubernetes.io/component: ledger
    app.kubernetes.io/part-of: fondaria
spec:
  # Governing headless Service for the StatefulSet's stable pod names. Not what
  # clients connect to -- TigerBeetle needs IP literals; see tigerbeetle-N below.
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: peer
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: tigerbeetle
---
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle-0
  labels:
    app.kubernetes.io/name: tigerbeetle
    app.kubernetes.io/component: ledger
    app.kubernetes.io/part-of: fondaria
spec:
  # Fixed ClusterIP: the IP literal for replica 0 in every TIGERBEETLE_ADDRESSES
  # list (tigerbeetle-config). Stable across pod restarts, unlike the pod IP.
  clusterIP: 10.96.100.100
  publishNotReadyAddresses: true
  ports:
    - name: peer
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: tigerbeetle
    statefulset.kubernetes.io/pod-name: tigerbeetle-0
---
