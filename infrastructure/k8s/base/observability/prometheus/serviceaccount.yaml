apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
automountServiceAccountToken: false
---
# Cluster-scoped (not a namespaced Role), since Task 10.2 (phase-10-edge.md)
# needs cnpg.yml's sibling `envoy-gateway.yml` scrape job to discover pods in
# envoy-gateway-system -- Envoy Gateway's own install.yaml namespace for the
# proxy Deployment it manages (infrastructure/k8s/bootstrap/versions.env
# ENVOY_GATEWAY_MANIFEST), which is neither `fondaria` nor something this
# kustomize tree's `namespace:` transformer reaches. Still read-only
# (get/list/watch on pods only, no secrets) -- the same permissions a
# namespaced Role already granted, just not bounded to one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pod-discovery
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Per-container CPU and memory from each kubelet's cAdvisor
  # (configmap.yaml, cadvisor.yml): node discovery, and `nodes/metrics` --
  # the kubelet's metrics endpoints only. Deliberately not `nodes/proxy`,
  # which would also open the kubelet's exec, log and pod endpoints.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pod-discovery
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-pod-discovery
subjects:
  # Explicit namespace, unlike the RoleBinding pattern elsewhere in this
  # tree: a ClusterRoleBinding has no "own namespace" for a ServiceAccount
  # subject to default to (that convenience is RoleBinding-only), and the
  # prod overlay sets no `namespace:` kustomize transformer for this
  # transformer to rewrite -- an unqualified subject here is a validation
  # error at apply time, not a silent no-op. `fondaria` matches every other
  # namespace reference in this tree (local overlay's own `namespace:
  # fondaria`, every ConfigMap/Deployment comment).
  - kind: ServiceAccount
    name: prometheus
    namespace: fondaria
