apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
automountServiceAccountToken: false
---
# Read-only list/watch on exactly the five resources deployment.yaml's
# --resources flag enables, nothing else: no secrets, no configmaps, no write
# verb. Cluster-scoped because nodes are, and because --namespaces reaches the
# operator namespaces (cnpg-system, rabbitmq-system, envoy-gateway-system,
# linkerd) that this tree's `namespace:` transformer does not own -- the same
# reason as prometheus-pod-discovery (prometheus/serviceaccount.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  # Explicit namespace for the same reason as prometheus-pod-discovery's
  # ClusterRoleBinding: a ClusterRoleBinding subject has no own namespace to
  # default to.
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: fondaria
