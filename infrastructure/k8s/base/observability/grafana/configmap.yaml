apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
data:
  datasources.yml: |
    # Task 11.1. Datasources provisioned from this file, never added by hand in
    # the UI -- a `down -v` wipes Grafana's own sqlite state (grafana.db), and a
    # datasource that only existed there would not come back.
    #
    # Each carries an explicit `uid:` (dashboards/collector-health.json binds its
    # panels to these, not to the datasource name) -- without it Grafana assigns
    # a random uid on every fresh provision, which resolves in the UI via a
    # name-fallback but 404s on the server-side query/alerting paths that only
    # ever look up by uid.
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
    
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
    
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
data:
  dashboards.yml: |
    # Task 11.1. Points Grafana at dashboard JSON files in Git
    # (infrastructure/observability/dashboards/) instead of dashboards created in
    # the UI, for the same reason as datasources.yml: they must survive `down -v`.
    apiVersion: 1
    
    providers:
      - name: git-provisioned
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fondaria
data:
  collector-health.json: |
    {
      "title": "Collector health (Task 11.1)",
      "uid": "collector-health",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Collector uptime (seconds)",
          "description": "otelcol_process_uptime -- the Collector's own self-telemetry, present from the moment it starts, independent of any service being instrumented (Task 11.2).",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "otelcol_process_uptime",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Collector process memory (RSS)",
          "description": "otelcol_process_memory_rss -- self-telemetry, live from the moment the Collector starts. otelcol_exporter_sent_* / otelcol_receiver_accepted_* only appear once a pipeline carries real traffic, which starts with Task 11.2's instrumentation -- not plotted here to avoid a panel that reads as broken until then.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "otelcol_process_memory_rss",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Scrape targets up",
          "description": "Every static_configs target in prometheus.yml -- 2 as of Task 11.1 (the Collector's self-telemetry port and its app fan-out port), both up regardless of service instrumentation.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(up)",
              "refId": "A"
            }
          ]
        }
      ]
    }
  financial-control.json: |
    {
      "title": "Financial Control (Task 11.3)",
      "uid": "financial-control",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "CDC Lag (seconds)",
          "description": "ledger_cdc_lag_seconds -- max lag between wall clock and last consumed ledger event. Warn > 30s, Page > 300s.",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max(ledger_cdc_lag_seconds)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 300 }
                ]
              },
              "unit": "s"
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Projection Drift (Total & Worst Account)",
          "description": "projection_drift_minor and eod_reconciliation_blocked. Any non-zero drift or blocked reconciliation indicates book imbalance.",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(abs(projection_drift_minor))",
              "legendFormat": "Total Drift (minor units)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max(abs(projection_drift_minor))",
              "legendFormat": "Worst Account Drift",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "eod_reconciliation_blocked",
              "legendFormat": "Reconciliation Blocked",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "EOD Hash-Chain Validity",
          "description": "eod_hash_chain_valid -- tamper-evident row_hash verification. 1 = valid, 0 = broken chain / page.",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "eod_hash_chain_valid",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "BROKEN", "color": "red" },
                    "1": { "text": "VALID", "color": "green" }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "DLQ Depth & Poison Messages",
          "description": "dlq_depth and increase(projection_poison_total[5m]). Never skip: unparseable messages land in DLQ and halt.",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "dlq_depth",
              "legendFormat": "DLQ Depth",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(projection_poison_total[5m]))",
              "legendFormat": "Poison Messages (5m)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CDC Lag Over Time",
          "description": "ledger_cdc_lag_seconds: one line per projection-worker pod, plus the worst pod (max), which is what the alerts read (ADR-0032 §4). A pod's lag is measured from its slowest active consumer.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "ledger_cdc_lag_seconds",
              "legendFormat": "{{instance}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max(ledger_cdc_lag_seconds)",
              "legendFormat": "Worst pod (alerts)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Ledger Head vs Projection Head",
          "description": "ledger_head_timestamp vs last_timestamp. Discrepancy shows unprocessed events buffered in the transport layer.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "ledger_head_timestamp / 1e9",
              "legendFormat": "Ledger Head",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "last_timestamp / 1e9",
              "legendFormat": "Projection Head ({{instance}})",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(max(ledger_head_timestamp) - min(last_timestamp)) / 1e9",
              "legendFormat": "Head Gap (s)",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Head Gap (s)" },
                "properties": [
                  { "id": "unit", "value": "s" },
                  { "id": "custom.axisPlacement", "value": "right" }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Transfer Rejection Rate by Reason",
          "description": "sum by (reason) (rate(transfer_rejected_total[5m])). Shows validation, balance ceiling, or business policy transfer rejections.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (reason) (rate(transfer_rejected_total[5m]))",
              "legendFormat": "{{reason}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Idempotency Conflicts & Replays",
          "description": "rate(idempotency_conflict_total[5m]) and rate(idempotency_replay_total[5m]). Distinguishes legitimate retries from payload mismatches.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(idempotency_conflict_total[5m]))",
              "legendFormat": "Conflicts",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(idempotency_replay_total[5m]))",
              "legendFormat": "Replays",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Reconciliation Run Status & Duration",
          "description": "Duration and block status of daily internal and custodian reconciliation passes (services/eod-job).",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(eod_reconciliation_duration_milliseconds_sum[1h]) / rate(eod_reconciliation_duration_milliseconds_count[1h])",
              "legendFormat": "Internal Recon Mean Duration (ms)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(eod_custodian_reconciliation_duration_milliseconds_sum[1h]) / rate(eod_custodian_reconciliation_duration_milliseconds_count[1h])",
              "legendFormat": "Custodian Recon Mean Duration (ms)",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "eod_reconciliation_blocked",
              "legendFormat": "Internal Recon Blocked",
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "eod_custodian_reconciliation_blocked",
              "legendFormat": "Custodian Recon Blocked",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*Blocked.*" },
                "properties": [
                  { "id": "unit", "value": "short" },
                  { "id": "custom.axisPlacement", "value": "right" }
                ]
              }
            ]
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Projection Drift History",
          "description": "History of projection_drift_minor and internal reconciliation breaks raised over time.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "projection_drift_minor",
              "legendFormat": "Total Drift (minor units)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "increase(eod_reconciliation_breaks_total[1h])",
              "legendFormat": "Reconciliation Breaks (1h)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Projection Queue Backlog (ready messages)",
          "description": "rabbitmq_detailed_queue_messages_ready per projection queue, from the broker. A queue that grows while its messages-committed rate is flat is the stall ProjectionQueueNotDraining pages on (docs/runbooks/slo-cdc-lag.md). Each worker also logs these depths once a minute (ADR-0035).",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~\"projection\\\\..*\"})",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Projection Messages Committed per Second",
          "description": "rate(projection_messages_total) per queue, summed over every projection-worker pod: what the projection actually committed and acknowledged (ADR-0035).",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (queue) (rate(projection_messages_total[5m]))",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Entries Queue Owners",
          "description": "sum by (queue) (projection_queue_owned): how many pods hold each entries queue's exclusive consume (ADR-0034 amendment). 1 is healthy; 0 means nobody drains that shard; per-pod lines show which pod owns it.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 30 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (queue) (projection_queue_owned)",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  business-overview.json: |
    {
      "title": "Business Overview & Fund Performance",
      "uid": "business-overview",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Operational Notice",
          "description": "Non-authoritative notice",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [],
          "options": {
            "mode": "markdown",
            "content": "⚠️ **Operational Notice**: *This dashboard displays lagging operational telemetry for visualization and monitoring purposes. The authoritative store of record for participant units is TigerBeetle (`UNITS_IN_ISSUE`); authoritative valuation is `reference.fund_nav`.*"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total Platform AUM",
          "description": "Lagging operational snapshot — non-authoritative. Total AUM across all funds in Mexican pesos.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(max by (fund_id) (fondaria_fund_aum_pesos))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyMXN"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total Units in Issue",
          "description": "Lagging operational snapshot — non-authoritative. Sum of units in issue across all funds from TigerBeetle UNITS_IN_ISSUE.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(max by (fund_id) (fondaria_fund_units_in_issue))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Participants Enrolled (selected range)",
          "description": "New participants enrolled by contribution files during the dashboard's time range, across funds (contribution-api counter, row 26k). Not a headcount: the counter is per pod and restarts at zero, which increase() absorbs.",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(fondaria_participants_enrolled_total[$__range]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Telemetry Snapshot Age",
          "description": "Age in seconds of the latest completed business snapshot sweep. Warn > 45s, Error > 120s.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 3 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "time() - max(fondaria_business_metrics_snapshot_timestamp_seconds)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 45 },
                  { "color": "red", "value": 120 }
                ]
              },
              "unit": "s"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Fund NAV Per Unit (MXN)",
          "description": "Struck NAV per unit over time, tracking market movements, gains, and falls.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max by (fund_id, fund_name, vehicle_type) (fondaria_fund_nav_pesos)",
              "legendFormat": "{{fund_name}} ({{vehicle_type}})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyMXN"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Units in Issue by Fund",
          "description": "Total units in issue per fund from TigerBeetle UNITS_IN_ISSUE contra account.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max by (fund_id, fund_name, vehicle_type) (fondaria_fund_units_in_issue)",
              "legendFormat": "{{fund_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "AUM by Fund (MXN)",
          "description": "Total AUM per fund in pesos (units in issue × live NAV).",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
