apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-policy
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept OTLP gRPC and HTTP telemetry from all fondaria workloads
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: fondaria
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Scrape target for Prometheus
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
    # Health probe check on dedicated extension port
    - ports:
        - protocol: TCP
          port: 13133
  egress:
    # Export traces to Tempo
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - protocol: TCP
          port: 4317
    # Export logs to Loki
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-policy
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Query traffic strictly from Grafana
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Scrape Collector self-telemetry and app fan-out metrics
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
    # Scrape RabbitMQ prometheus endpoint
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 15692
    # Workload state from kube-state-metrics (scrape.d/kube-state-metrics.yml)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
    # CloudNativePG instance metrics (scrape.d/cnpg.yml)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 9187
    # Pod service discovery through the API server (DNAT-ed before egress
    # policy is evaluated, so by port, not by pod).
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-policy
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingest trace spans from Collector
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Queries strictly from Grafana
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3200
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-policy
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingest logs from Collector
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 3100
    # Queries strictly from Grafana
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3100
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-policy
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP UI and dashboard traffic (allowed from ingress / port-forward / nodeport)
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Proxy queries strictly to Prometheus, Tempo, and Loki
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - protocol: TCP
          port: 3200
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-policy
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics scrape strictly from Prometheus
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    # Readiness/startup probe on the telemetry port
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    # list/watch through the API server (DNAT-ed before egress policy is
    # evaluated, so by port, not by pod -- as prometheus-policy above)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
