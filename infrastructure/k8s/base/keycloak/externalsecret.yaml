apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: fondaria
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: fondaria/keycloak
        property: adminUser
    - secretKey: admin-password
      remoteRef:
        key: fondaria/keycloak
        property: adminPassword
---
# The confidential clients' secrets (employer-portal, internal-services), read
# by deployment.yaml into the realm import's placeholders. Production only;
# the local overlay replaces this with a generated Secret of the same name.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-client-secrets
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: fondaria
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: keycloak-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: employer-portal
      remoteRef:
        key: fondaria/keycloak
        property: employerPortalClientSecret
    - secretKey: internal-services
      remoteRef:
        key: fondaria/keycloak
        property: internalServicesClientSecret
