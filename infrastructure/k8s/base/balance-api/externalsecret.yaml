apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: balance-api-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: balance-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fondaria
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: balance-api-secret
    creationPolicy: Owner
  data:
    - secretKey: QUERY_CURSOR_SECRET
      remoteRef:
        key: fondaria/balance-api
        property: cursorSecret
