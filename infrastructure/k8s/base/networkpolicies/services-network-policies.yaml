# --- Object store ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-store-policy
  labels:
    app.kubernetes.io/name: object-store
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: object-store
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # S3 API only: the services that own a bucket, Postgres backups, and the
    # bucket-provisioning Job. SeaweedFS's master/volume/filer ports bind the
    # pod's loopback and are never admitted here (ADR-0031).
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - contribution-api
                  - valuation-api
                  - statement-worker
                  - eod-job
                  - postgres
                  - object-store-buckets
      ports:
        - protocol: TCP
          port: 8333
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-store-buckets-policy
  labels:
    app.kubernetes.io/name: object-store-buckets
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: object-store-buckets
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store
      ports:
        - protocol: TCP
          port: 8333
---
