# --- Storage / Infrastructure Network Policies ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerbeetle-policy
  labels:
    app.kubernetes.io/name: tigerbeetle
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tigerbeetle
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow client connections only from authorized services (Task 10.5: edge cannot reach storage directly)
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - contribution-api
                  - balance-api
                  - valuation-api
                  - allotment-job
                  - eod-job
                  - tigerbeetle-cdc
                  - tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow replication peer-to-peer traffic within TigerBeetle cluster
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow client database traffic only from authorized backend services
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - contribution-api
                  - balance-api
                  - valuation-api
                  - allotment-job
                  - projection-worker
                  - statement-worker
                  - eod-job
                  - postgres
      ports:
        - protocol: TCP
          port: 5432
    # Keycloak (Task D.3, ADR-0026) is identity infrastructure, not an application
    # service -- given its own explicit rule rather than folded into the shared
    # app-service list above, so that list keeps meaning exactly "the platform's
    # own services" (asserted by PoliciesAndScalingValidationTest).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 5432
    # Prometheus scrapes the instance manager's metrics endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
    # CloudNativePG's operator reaches every instance's manager (status, probes,
    # metrics) on 8000 from its own namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # The Kubernetes API server. The operator-managed pods talk to it directly
    # (CloudNativePG's instance manager; RabbitMQ's k8s peer discovery). The
    # cluster's `kubernetes` Service is DNAT-ed to the control-plane endpoint
    # before egress policy is evaluated, so this is by port, not by pod.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Postgres sync replication to peers
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - postgres
      ports:
        - protocol: TCP
          port: 5432
    # Continuous WAL / backup streaming to the object store (S3 API)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store
      ports:
        - protocol: TCP
          port: 8333
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-policy
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow AMQP 5672 and cluster peer traffic from messaging clients and cluster nodes
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tigerbeetle-cdc
                  - amqp-fanout
                  - projection-worker
                  - statement-worker
                  - eod-job
                  - rabbitmq
                  - rabbitmq-topology
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 25672
    # Allow Prometheus metrics scraping on port 15692 from monitoring collectors
    - ports:
        - protocol: TCP
          port: 15692
  egress:
    # The Kubernetes API server. The operator-managed pods talk to it directly
    # (CloudNativePG's instance manager; RabbitMQ's k8s peer discovery). The
    # cluster's `kubernetes` Service is DNAT-ed to the control-plane endpoint
    # before egress policy is evaluated, so this is by port, not by pod.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # RabbitMQ clustering and Erlang distribution traffic
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 25672
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-policy
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Redis/Valkey traffic from caching clients
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - contribution-api
                  - balance-api
                  - valuation-api
                  - statement-worker
                  - valkey
      ports:
        - protocol: TCP
          port: 6379
    # Task 10.3: Envoy Gateway's global rate limit service, deployed in
    # envoy-gateway-system (a namespace this tree does not own -- same
    # reason Task 10.2's prometheus-pod-discovery ClusterRole had to reach
    # across, not scope down to, a namespace boundary). Found live this
    # session: without this rule the pod's own Redis client fails with
    # "dial tcp ...: i/o timeout", not an auth error -- the default-deny
    # policy, not the missing password, was the first thing blocking it.
    # kubernetes.io/metadata.name is the automatic, unforgeable label every
    # namespace carries since Kubernetes 1.21 -- no label needs adding to a
    # namespace this tree doesn't manage.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy-ratelimit
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Valkey cluster bus traffic between nodes
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
---
# --- Application Services Network Policies ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contribution-api-policy
  labels:
    app.kubernetes.io/name: contribution-api
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: contribution-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Inbound HTTP from ingress/gateway or internal services
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # To PostgreSQL
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [postgres]
      ports:
        - protocol: TCP
          port: 5432
    # To TigerBeetle
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    # To Valkey
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
    # To the object store (S3 API)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: object-store
      ports:
        - protocol: TCP
          port: 8333
---
