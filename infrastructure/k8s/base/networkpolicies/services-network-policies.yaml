---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-policy
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fondaria
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # No in-cluster caller today (Phase 10's edge gateway is what will call
    # the token/JWKS endpoints once it exists); reachable meanwhile only via
    # `kubectl port-forward`, which bypasses this policy entirely since it
    # tunnels through the kubelet rather than the pod network.
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
