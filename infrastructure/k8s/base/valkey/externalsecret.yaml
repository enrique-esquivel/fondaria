apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: valkey-credentials
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: fondaria
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    # Read by Valkey itself (requirepass) and by every service that opens a
    # cache connection. The local overlay replaces this with a secretGenerator.
    name: valkey-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: fondaria/valkey
        property: password
