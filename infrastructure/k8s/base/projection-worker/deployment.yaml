apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-worker
  labels:
    app.kubernetes.io/name: projection-worker
    app.kubernetes.io/component: projection
    app.kubernetes.io/part-of: fondaria
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # No HPA on projection-worker (Task 12.5). Every instance consumes all 17 queues
  # (the transfers queue and the 16 consistent-hash entry queues) in batches (ADR-0034). Each
  # entries queue is drained by one exclusive consumer across all replicas; the others stand by
  # and take a queue over when its owner stops (ADR-0034 amendment, row 26w). The transfers
  # queue has PROJECTION_TRANSFER_CONSUMERS competing consumers per replica. Correctness never
  # depends on that topology: ParticipantUnitsProjection's advisory lock and repair cascade
  # (ADR-0024) still hold. Entries throughput comes from the number of queues, not replicas;
  # replicas add failover. Every replica's connection pool counts against CNPG's
  # max_connections -- see the configmap.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: projection-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projection-worker
        app.kubernetes.io/component: projection
        app.kubernetes.io/part-of: fondaria
      annotations:
        # Task 10.4 (ADR-0029): meshed for uniform default-deny -- nothing
        # calls projection-worker over HTTP, so no Server/AuthorizationPolicy
        # names a caller; mesh policy denies every non-probe inbound
        # connection by default. automountServiceAccountToken: false below
        # does not block injection -- verified live.
        linkerd.io/inject: enabled
        # Linkerd's proxy as a native sidecar (an init container with restartPolicy:
        # Always) that starts before the wait-for-* init containers, so their checks
        # carry this workload's mesh identity -- the datastores' AuthorizationPolicies
        # admit nothing else. Injected the classic way, the proxy starts only after
        # every init container, and linkerd-init's iptables rules would send their
        # traffic to a proxy that is not listening yet. Both spellings: the alpha
        # annotation (Linkerd 2.15-2.17) and the beta one that replaced it.
        config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
        config.beta.linkerd.io/proxy-enable-native-sidecar: "true"
    spec:
      priorityClassName: fondaria-stateless-default
      serviceAccountName: projection-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: projection-worker
      # Startup ordering (ADR-0037): each wait-for-* blocks until one dependency is
      # genuinely usable, using infrastructure/k8s/base/startup-waits/. A dependency
      # that never comes leaves the pod in Init:Error naming it, not Running and idle.
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:17.2@sha256:61d2b391e3e324d05edc6c65c555989a7c544ddb72ef271b3abd4a35b57942b1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/postgres.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: POSTGRES_URL
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
        - name: wait-for-rabbitmq
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/rabbitmq.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_AMQP_HOST
            - name: RABBITMQ_VHOST
              valueFrom:
                configMapKeyRef:
                  name: projection-worker-config
                  key: PROJECTION_AMQP_VHOST
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
      containers:
        - name: projection-worker
          image: fondaria/projection-worker:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-mgmt
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: projection-worker-config
          # Credentials come from the Secrets the operators generate (CloudNativePG's
          # <cluster>-app, the RabbitMQ operator's <cluster>-default-user) and from the
          # platform-level object-store-credentials -- never a per-service secret store entry.
          env:
            # ADR-0032: the pod name prefixes this pod's checkpoint consumer ids.
            - name: PROJECTION_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRACE_CORRELATION_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-credentials
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: PROJECTION_AMQP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: PROJECTION_AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # Startup probe: Spring Boot 3.5 initializes Flyway schema check, PostgreSQL connection
          # pool, and AMQP consumer containers for consistent-hash queues.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          # Liveness probe: Actuator liveness state verifies JVM and listener thread health.
          # Fails if ProjectionHalt trips due to unrecoverable poison message.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-mgmt
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness probe: Actuator readiness state verifies database connection and AMQP listener status.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-mgmt
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: startup-waits
          configMap:
            name: startup-waits
        - name: startup-wait-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
