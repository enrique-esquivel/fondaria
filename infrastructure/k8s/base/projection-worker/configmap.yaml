apiVersion: v1
kind: ConfigMap
metadata:
  name: projection-worker-config
  labels:
    app.kubernetes.io/name: projection-worker
    app.kubernetes.io/component: projection
    app.kubernetes.io/part-of: fondaria
data:
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  TOMCAT_BASEDIR: "/tmp/projection-worker"
  POSTGRES_URL: "jdbc:postgresql://postgres-rw:5432/funds?sslmode=disable"
  PROJECTION_AMQP_HOST: "rabbitmq"
  PROJECTION_AMQP_PORT: "5672"
  PROJECTION_AMQP_VHOST: "/"
  PROJECTION_TRANSFERS_EXCHANGE: "ledger.transfers.v1"
  PROJECTION_ENTRIES_EXCHANGE: "ledger.entries.v1"
  PROJECTION_DEAD_LETTER_QUEUE: "ledger.entries.dlq"
  PROJECTION_TRANSFERS_QUEUE: "projection.transfers.v1"
  PROJECTION_ENTRIES_QUEUE_PREFIX: "projection.entries.v1"
  PROJECTION_ENTRIES_QUEUE_COUNT: "16"
  PROJECTION_PREFETCH: "50"
  # ADR-0034 (amended by row 26w): batches of up to 200 deliveries or 100 ms, one transaction
  # and one ack per batch. Each of the 16 entries queues has one exclusive consumer, active on
  # exactly one pod (the others stand by); the transfers queue has 4 competing consumers per pod.
  # One pod may own every entries queue (at startup, before the ADR-0042 rebalance spreads them,
  # or alone after a failover), so 16 + 4 of the pool's 24 (startup refuses more than 24 - 2). 3 pods x 24 = 72 of CNPG's max_connections 200. Prefetch is raised to the batch size.
  PROJECTION_TRANSFER_CONSUMERS: "4"
  PROJECTION_BATCH_SIZE: "200"
  PROJECTION_BATCH_TIMEOUT: "100ms"
  POSTGRES_MAX_POOL_SIZE: "24"
  PROJECTION_CHECKPOINT_ACTIVE_WINDOW: "5m"
  PROJECTION_CHECKPOINT_RETENTION: "1h"
  PROJECTION_HALT_POLL_INTERVAL: "1s"
  PROJECTION_ACTIVITY_LOG_INTERVAL: "1m"
  PROJECTION_REBALANCE_INTERVAL: "30s"
  TRACE_CORRELATION_REDIS_URL: "redis://valkey:6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
