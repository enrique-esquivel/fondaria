apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerbeetle-cdc
  labels:
    app.kubernetes.io/name: tigerbeetle-cdc
    app.kubernetes.io/component: cdc
    app.kubernetes.io/part-of: fondaria
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # NOTE: No HPA on tigerbeetle-cdc (Phase 12, Task 12.5). The CDC stream is a singleton
  # by design; exactly 2 replicas run for warm-standby leader election via RabbitMQ's
  # exclusive locker queue (ADR-0007). Additional replicas would only sit in restart loops.
  replicas: 2
  # ADR-0033: every pod of this Deployment holds one TigerBeetle client connection, and the
  # replica accepts only 32. A rollout's surge pods hold one each too, so the surge is pinned
  # to one pod rather than the 25% default; LedgerClientBudgetValidationTest counts it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tigerbeetle-cdc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tigerbeetle-cdc
        app.kubernetes.io/component: cdc
        app.kubernetes.io/part-of: fondaria
    spec:
      priorityClassName: fondaria-stateless-default
      serviceAccountName: tigerbeetle-cdc
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # io_uring is TigerBeetle's I/O engine and the container runtime's default
        # seccomp profile blocks the io_uring_* syscalls (the `tigerbeetle amqp` connector
        # exits with "io_uring is not available ... PermissionDenied"; docs/ENGINEERING-RULES.md
        # "Local Infrastructure" records the same for compose). Unconfined is the
        # one exception the security policy carves out, by name, for this
        # workload; a Localhost profile (runtime default + io_uring_*) installed on
        # the ledger node pool is the tighter prod follow-up.
        seccompProfile:
          type: Unconfined
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tigerbeetle-cdc
      # Startup ordering (ADR-0037): each wait-for-* blocks until one dependency is
      # genuinely usable, using infrastructure/k8s/base/startup-waits/. A dependency
      # that never comes leaves the pod in Init:Error naming it, not Running and idle.
      initContainers:
        - name: wait-for-rabbitmq
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/rabbitmq.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: tigerbeetle-cdc-config
                  key: CDC_AMQP_HOST
            - name: RABBITMQ_VHOST
              valueFrom:
                configMapKeyRef:
                  name: tigerbeetle-cdc-config
                  key: CDC_AMQP_VHOST
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: CDC_PUBLISH_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: tigerbeetle-cdc-config
                  key: CDC_PUBLISH_EXCHANGE
            # The CDC job publishes into this exchange from its first event; until
            # bridge.ledger is bound to it, a fanout exchange drops every message.
            - name: WAIT_RABBITMQ_BINDINGS
              value: "$(CDC_PUBLISH_EXCHANGE)>bridge.ledger"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
        - name: wait-for-tigerbeetle
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-waits/tigerbeetle.sh
          securityContext:
            # Linkerd's proxy UID: linkerd-init's iptables rules let this UID's traffic
            # bypass the proxy. Through the proxy, a TCP connect succeeds whether or not
            # the replica behind it is up, and TigerBeetle is unmeshed (ADR-0029), so the
            # check must reach the replicas directly. Only this container runs as 2102.
            runAsUser: 2102
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TIGERBEETLE_ADDRESSES
              valueFrom:
                configMapKeyRef:
                  name: tigerbeetle-cdc-config
                  key: CDC_TIGERBEETLE_ADDRESSES
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: startup-waits
              mountPath: /startup-waits
              readOnly: true
            - name: startup-wait-tmp
              mountPath: /tmp
      containers:
        - name: tigerbeetle-cdc
          image: ghcr.io/tigerbeetle/tigerbeetle@sha256:3ea0602e798cf58985fe1b5a4bc4b254b3d8899462f7d05cc314ab0a06b88a7d
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /run.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: tigerbeetle-cdc-config
          # Credentials come from the Secrets the operators generate (CloudNativePG's
          # <cluster>-app, the RabbitMQ operator's <cluster>-default-user) and from the
          # platform-level object-store-credentials -- never a per-service secret store entry.
          env:
            - name: CDC_AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: CDC_AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup probe: Verifies the supervisor loop process started and can resolve
          # TigerBeetle and RabbitMQ endpoints.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep -q tigerbeetle"
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 2
          # Liveness probe: Ensures the supervisor loop process remains alive.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep -q run.sh"
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # Readiness probe: Active replica holds the exclusive locker queue; standby replica is warm (ADR-0007).
          # Both pods report ready to ensure standby pod remains scheduled and ready to claim lock on failover.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "true"
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cdc-script
              mountPath: /run.sh
              subPath: run.sh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: cdc-script
          configMap:
            name: tigerbeetle-cdc-script
            defaultMode: 0755
        - name: startup-waits
          configMap:
            name: startup-waits
        - name: startup-wait-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
