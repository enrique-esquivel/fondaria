apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: fondaria
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@fondaria.example
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fondaria-prod-tls
  labels:
    app.kubernetes.io/part-of: fondaria
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Task 10.1: this is the name gateway.yaml's listeners reference
  # (certificateRefs), the same Secret name overlays/local generates from a
  # self-signed pair -- "local and prod differ only in hostnames and
  # certificates" (phase-10-edge.md) holds because both name the Secret
  # identically and only its contents differ.
  secretName: fondaria-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: fondaria.example
  dnsNames:
    - fondaria.example
    - "*.fondaria.example"
