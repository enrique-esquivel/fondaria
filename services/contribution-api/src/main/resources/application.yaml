spring:
  application:
    name: contribution-api
  threads:
    virtual:
      enabled: true
  flyway:
    # The schemas themselves are created by the migrations (ADR-0011), so Flyway
    # is pointed at the default schema only for its own history table.
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  # Must resolve to a writable path: the container runs with a read-only root
  # filesystem and only /tmp is mounted writable. See Dockerfile.
  tomcat:
    basedir: ${TOMCAT_BASEDIR:/tmp/contribution-api}

management:
  endpoints:
    web:
      exposure:
        include: health,loggers
  endpoint:
    health:
      probes:
        enabled: true
      # Never render component details: they would expose ledger hostnames
      # (docs/ENGINEERING-RULES.md §7). The probe only needs the aggregate status.
      show-details: never
      show-components: never
      group:
        # Liveness deliberately excludes the ledger. Restarting this pod cannot
        # repair a ledger outage; wiring it here would turn one outage into a
        # fleet-wide restart loop.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,ledger
        # `demoClock` alone, `show-details` overridden back on for this group only -- the top-level
        # endpoint's `never` (line 33) stays exactly as strict as it was; only this narrow, already
        # non-sensitive component (`DemoClockHealthIndicator` reports nothing but a boolean flag and
        # an offset) is visible, at its own path, for `demo-tools advance` to poll for convergence
        # (`phase-D-demo.md` Task D.2).
        demo:
          include: demoClock
          show-details: always
          show-components: always

  opentelemetry:
    resource-attributes:
      # Row 26k (same fix as projection-worker, ADR-0032 §4): the Collector's Prometheus exporter
      # turns service.instance.id into the `instance` label. Without it every replica's
      # fondaria_participants_enrolled_total is one series the pods overwrite, and increase() reads
      # each swing between them as a counter reset -- the dashboard tile would count many times over.
      "[service.instance.id]": ${HOSTNAME:local}

  # Task 11.2: real spans and domain metrics to the OTel Collector (Task 11.1).
  # This service never names Prometheus, Tempo or Loki directly -- the
  # Collector is the only address configured (Task 11.1's own acceptance
  # criterion).
  tracing:
    sampling:
      # Every span is exported, not a probabilistic sample. Task 11.2's
      # acceptance criteria ("every ledger call is a span", "a single trace
      # spans HTTP -> ledger -> CDC -> projection") need the trace that
      # actually happened, not a 10%-of-the-time one.
      probability: 1.0
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 50ms,250ms,1s
        http.server.requests: 50ms,250ms,1s
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      transport: http
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

fondaria:
  demo-clock:
    # Task D.1. DEMO_CLOCK_ENABLED must never be set in production -- unset,
    # this service never reads reference.demo_clock at all. The local Kustomize
    # overlay is the only place that sets it to "true".
    enabled: ${DEMO_CLOCK_ENABLED:false}

  database:
    # No defaults. Production must fail to start when a required secret is
    # absent (docs/ENGINEERING-RULES.md §4); the local-dev values live in
    # infrastructure/compose/.env.example.
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    connect-timeout: ${POSTGRES_CONNECT_TIMEOUT:5s}
    max-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}

  identity:
    # Both must never change once an organization is registered or a ledger
    # account exists — see IdentityProperties.
    organization-namespace: ${ORGANIZATION_ID_NAMESPACE:}
    ledger-namespace: ${LEDGER_ID_NAMESPACE:}

  participant-identity:
    # Task 9.5: the master key (KEK) wrapping every participant's own AES-256
    # data key. No default -- production must fail to start when a required
    # secret is absent (docs/ENGINEERING-RULES.md §4); the local-dev value lives in
    # infrastructure/compose/.env.example. Base64, 32 bytes once decoded.
    master-key-base64: ${PARTICIPANT_IDENTITY_MASTER_KEY:}

  cache:
    # Redis is a 24h response cache for cash receipts and nothing more (Task
    # 3.3). Absence of a required value is a startup failure naming it; an
    # outage at runtime is a cache miss and nothing else. No credentials in the
    # URL — the password is supplied separately, so a hostname can be logged
    # and a secret cannot.
    url: ${REDIS_URL:}
    password: ${REDIS_PASSWORD:}
    command-timeout: ${REDIS_COMMAND_TIMEOUT:1s}
    cash-receipt-ttl: ${CASH_RECEIPT_CACHE_TTL:24h}
    # Task 11.2: how long a transferId -> traceparent correlation entry survives.
    # Short on purpose -- a miss only degrades a trace, never correctness.
    trace-correlation-ttl: ${TRACE_CORRELATION_TTL:5m}

  object-store:
    # Contribution files (ADR-0009). No defaults for the connection values:
    # production must fail to start when a required secret is absent
    # (docs/ENGINEERING-RULES.md §4); the local-dev values live in
    # infrastructure/compose/.env.example. The bucket is provisioned by the
    # deployment — this service never creates one.
    endpoint: ${OBJECT_STORE_ENDPOINT:}
    access-key: ${OBJECT_STORE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORE_SECRET_KEY:}
    region: ${OBJECT_STORE_REGION:us-east-1}
    bucket: ${CONTRIBUTION_FILE_BUCKET:}
    # A presigned URL is a write grant. Short-lived on purpose.
    upload-url-ttl: ${CONTRIBUTION_UPLOAD_URL_TTL:15m}
    # Largest file read into memory. Generous — a dispersion file can carry
    # hundreds of thousands of rows — but never unbounded, because the size is
    # chosen by the caller.
    maximum-object-bytes: ${CONTRIBUTION_FILE_MAX_BYTES:67108864}
    call-timeout: ${OBJECT_STORE_CALL_TIMEOUT:10s}

  calendar:
    # Task 7.1's BusinessCalendar, applied by DealingDateRule (Task 21.1) to decide
    # which valuation date a staged batch deals at. These MUST be the identical
    # values valuation-api reads: a batch dealt at a date that service will not
    # strike a NAV for is a batch that never gets priced. The holiday list is a
    # STOPGAP — Task 7.1 specifies Mexican banking and market holidays as
    # effective-dated reference data and that table does not exist yet. Until it
    # does, an empty list means weekends are the only non-business dates. See
    # CalendarProperties.
    zone: ${CALENDAR_ZONE:America/Mexico_City}
    cutoff-time: ${CALENDAR_CUTOFF_TIME:18:00}
    holidays: ${CALENDAR_HOLIDAYS:}

  batch-validation:
    # Operational tuning, not secrets: every value has a working default, and a
    # deployment that sets none of them validates correctly on this cadence.
    poll-interval: ${BATCH_VALIDATION_POLL_INTERVAL:5s}
    batch-size: ${BATCH_VALIDATION_BATCH_SIZE:10}
    # How long a batch may sit in VALIDATING before another sweep may reclaim
    # it. Must comfortably exceed the time to fetch, parse and check the
    # largest file expected, or a slow validation is reclaimed underneath
    # itself.
    stale-after: ${BATCH_VALIDATION_STALE_AFTER:10m}
    # Most rows one part of a split file may hold (ADR-0017). A part is allotted
    # as ONE linked chain, and a chain cannot exceed 8,189 transfers, so this is
    # a correctness bound and not only tuning. Clamped in
    # BatchValidationProperties, and bounded again by the partitioner's leg
    # budget — rows and transfers are not the same count.
    max-rows-per-part: ${BATCH_VALIDATION_MAX_ROWS_PER_PART:4093}

  ledger:
    # No default. Absence is a startup failure naming the variable — see
    # LedgerEndpoints#parse. The local-dev value is documented in
    # infrastructure/compose/.env.example.
    addresses: ${TIGERBEETLE_ADDRESSES:}
    connect-timeout: ${TIGERBEETLE_CONNECT_TIMEOUT:1s}
    probe-cache-ttl: ${LEDGER_PROBE_CACHE_TTL:5s}
    client:
      # No default: defaulting to cluster 0 would silently address whichever
      # cluster happens to have been formatted with that id.
      cluster-id: ${TIGERBEETLE_CLUSTER_ID:}
      cluster-name: ${LEDGER_CLUSTER_NAME:primary}
      call-timeout: ${TIGERBEETLE_CALL_TIMEOUT:5s}
