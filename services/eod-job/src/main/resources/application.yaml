spring:
  application:
    name: eod-job
  threads:
    virtual:
      enabled: true
  flyway:
    # The shared migration tree in libs/db-migrations (ADR-0011's four schemas are one
    # database, not one per service). Every service migrates the same locations against
    # the same history table, so version numbers are a single global sequence and no
    # service can hold a private view of the schema.
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

  rabbitmq:
    host: ${SIGNOFF_AMQP_HOST:}
    port: ${SIGNOFF_AMQP_PORT:5672}
    username: ${SIGNOFF_AMQP_USERNAME:}
    password: ${SIGNOFF_AMQP_PASSWORD:}
    virtual-host: ${SIGNOFF_AMQP_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    observation-enabled: true

server:
  # Must resolve to a writable path: the container runs with a read-only root
  # filesystem and only /tmp is mounted writable.
  tomcat:
    basedir: ${TOMCAT_BASEDIR:/tmp/eod-job}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Never render component details: they would expose ledger hostnames
      # (docs/ENGINEERING-RULES.md §7). The probe only needs the aggregate status.
      show-details: never
      show-components: never
      group:
        # Liveness deliberately excludes the ledger. Restarting this pod cannot
        # repair a ledger outage; wiring it here would turn one outage into a
        # fleet-wide restart loop.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,ledger
        # `demoClock` alone, `show-details` overridden back on for this group only -- see
        # contribution-api's application.yaml for the full rationale (Task D.2).
        demo:
          include: demoClock
          show-details: always
          show-components: always

  opentelemetry:
    resource-attributes:
      # Row 26n (as projection-worker, ADR-0032 §4): the Collector's Prometheus exporter turns
      # service.instance.id into the `instance` label. Without it every replica's counters are one
      # series the pods overwrite, and rate()/increase() read each swing as a counter reset.
      "[service.instance.id]": ${HOSTNAME:local}

  # Task 11.2: real spans and domain metrics to the OTel Collector (Task 11.1).
  # This service never names Prometheus, Tempo or Loki directly -- the
  # Collector is the only address configured (Task 11.1's own acceptance
  # criterion).
  tracing:
    sampling:
      # Every span is exported, not a probabilistic sample. Task 11.2's
      # acceptance criteria ("every ledger call is a span", "a single trace
      # spans HTTP -> ledger -> CDC -> projection") need the trace that
      # actually happened, not a 10%-of-the-time one.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      transport: http
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

fondaria:
  demo-clock:
    # Task D.1. DEMO_CLOCK_ENABLED must never be set in production -- unset,
    # this service never reads reference.demo_clock at all. The local Kustomize
    # overlay is the only place that sets it to "true".
    enabled: ${DEMO_CLOCK_ENABLED:false}

  database:
    # No defaults. Production must fail to start when a required secret is
    # absent (docs/ENGINEERING-RULES.md §4); the local-dev values live in
    # infrastructure/compose/.env.example.
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    connect-timeout: ${POSTGRES_CONNECT_TIMEOUT:5s}
    max-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}

  identity:
    # Must be the identical value every other service uses. The tie-out re-derives every
    # participant holding account and every pooled cash account from it; a namespace that
    # differs by a byte reads the whole platform as holding nothing and reports a break on
    # every fund. See IdentityProperties.
    ledger-namespace: ${LEDGER_ID_NAMESPACE:}

  calendar:
    # Task 7.1's BusinessCalendar — which business date a reconciliation pass is filed
    # against. These MUST be the identical values every other service reads; see
    # CalendarProperties.
    zone: ${CALENDAR_ZONE:America/Mexico_City}
    cutoff-time: ${CALENDAR_CUTOFF_TIME:18:00}
    holidays: ${CALENDAR_HOLIDAYS:}

  reconciliation:
    # Operational tuning, not secrets: every value has a working default, and a
    # deployment that sets none of them reconciles correctly on this cadence.
    poll-interval: ${RECONCILIATION_POLL_INTERVAL:1h}
    # Bounded by one ledger message body — the same 8,189 that bounds a linked chain
    # (LedgerLimits, ADR-0017). A larger value fails startup rather than being truncated.
    account-lookup-batch-size: ${RECONCILIATION_ACCOUNT_LOOKUP_BATCH:8189}
    holding-page-size: ${RECONCILIATION_HOLDING_PAGE_SIZE:50000}

  custodian-reconciliation:
    # Task 7.3. Same reasoning as fondaria.reconciliation above — operational tuning,
    # every value has a working default.
    poll-interval: ${CUSTODIAN_RECONCILIATION_POLL_INTERVAL:1h}
    real-break-escalation-days: ${CUSTODIAN_REAL_BREAK_ESCALATION_DAYS:3}
    timing-difference-escalation-days: ${CUSTODIAN_TIMING_DIFFERENCE_ESCALATION_DAYS:5}

  signoff:
    poll-interval: ${SIGNOFF_POLL_INTERVAL:1h}
    amqp-host: ${SIGNOFF_AMQP_HOST:}
    exchange-name: ${SIGNOFF_EXCHANGE_NAME:close.signed-off.v1}
    publish-confirm-timeout: ${SIGNOFF_PUBLISH_CONFIRM_TIMEOUT:30s}

  snapshot:
    # Task 7.4. Operational tuning, not secrets — every value has a working default.
    poll-interval: ${SNAPSHOT_POLL_INTERVAL:1h}
    # The unit of work for all three of the pass's reads: the keyset scan over
    # workflow.allotment, the as-of units query and the cost-basis range. Bounds memory,
    # never correctness.
    holding-page-size: ${SNAPSHOT_HOLDING_PAGE_SIZE:10000}
    # Bounded by one ledger message body (LedgerLimits), as fondaria.reconciliation is. Only
    # UNITS_IN_ISSUE is read here — one account per fund — so it is effectively never
    # reached; a larger value fails startup rather than being truncated, because a
    # truncated read looks exactly like a fund with nothing in issue and would let an
    # incomplete file tie.
    account-lookup-batch-size: ${SNAPSHOT_ACCOUNT_LOOKUP_BATCH:8189}
    # Objects are stored at <prefix>/dt=YYYY-MM-DD/. Configurable so one bucket can hold
    # more than one environment's output.
    key-prefix: ${SNAPSHOT_KEY_PREFIX:snapshots}
    # The positions file is built in memory (PositionFileWriter), so this is the memory
    # bound. Past it the pass fails naming both numbers rather than dying of an OOM.
    max-object-bytes: ${SNAPSHOT_MAX_OBJECT_BYTES:1073741824}

  snapshot-object-store:
    # No defaults for the secrets. Production must fail to start when one is absent
    # (docs/ENGINEERING-RULES.md §4); the local-dev values live in infrastructure/compose/.env.example.
    # The endpoint and credentials are the same object store every other service reads; only the
    # bucket differs — different producer, different retention, different access.
    endpoint: ${OBJECT_STORE_ENDPOINT:}
    access-key: ${OBJECT_STORE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORE_SECRET_KEY:}
    region: ${OBJECT_STORE_REGION:us-east-1}
    bucket: ${SNAPSHOT_BUCKET:}
    # Generous next to an API's: this writes a file that can run to tens of megabytes, and
    # a timeout tuned for a small object would fail the close on a large book rather than
    # on a real fault.
    call-timeout: ${SNAPSHOT_OBJECT_STORE_CALL_TIMEOUT:30s}

  ledger:
    # No default. Absence is a startup failure naming the variable — see
    # LedgerHealthIndicator#parse. The local-dev value is documented in
    # infrastructure/compose/.env.example, shared with every other service — all must
    # resolve to the same TigerBeetle cluster.
    addresses: ${TIGERBEETLE_ADDRESSES:}
    connect-timeout: ${TIGERBEETLE_CONNECT_TIMEOUT:1s}
    probe-cache-ttl: ${LEDGER_PROBE_CACHE_TTL:5s}
    client:
      # No default: defaulting to cluster 0 would silently address whichever
      # cluster happens to have been formatted with that id.
      cluster-id: ${TIGERBEETLE_CLUSTER_ID:}
      cluster-name: ${LEDGER_CLUSTER_NAME:primary}
      call-timeout: ${TIGERBEETLE_CALL_TIMEOUT:5s}
