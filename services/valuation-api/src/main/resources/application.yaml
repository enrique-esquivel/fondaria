spring:
  application:
    name: valuation-api
  threads:
    virtual:
      enabled: true
  flyway:
    # The shared migration tree in libs/db-migrations (ADR-0011's four schemas are one
    # database, not one per service). Both services migrate the same locations against
    # the same history table, so version numbers are a single global sequence and
    # neither service can hold a private view of the schema.
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  # Must resolve to a writable path: the container runs with a read-only root
  # filesystem and only /tmp is mounted writable.
  tomcat:
    basedir: ${TOMCAT_BASEDIR:/tmp/valuation-api}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Never render component details: they would expose hostnames (AGENTS.md §7).
      show-details: never
      show-components: never
      group:
        # `demoClock` alone, `show-details` overridden back on for this group only -- see
        # contribution-api's application.yaml for the full rationale (Task D.2).
        demo:
          include: demoClock
          show-details: always
          show-components: always

  opentelemetry:
    resource-attributes:
      # Row 26n (as projection-worker, ADR-0032 §4): the Collector's Prometheus exporter turns
      # service.instance.id into the `instance` label. Without it every replica's counters are one
      # series the pods overwrite, and rate()/increase() read each swing as a counter reset.
      "[service.instance.id]": ${HOSTNAME:local}

  # Task 11.2: real spans and domain metrics to the OTel Collector (Task 11.1).
  # This service never names Prometheus, Tempo or Loki directly -- the
  # Collector is the only address configured (Task 11.1's own acceptance
  # criterion).
  tracing:
    sampling:
      # Every span is exported, not a probabilistic sample. Task 11.2's
      # acceptance criteria ("every ledger call is a span", "a single trace
      # spans HTTP -> ledger -> CDC -> projection") need the trace that
      # actually happened, not a 10%-of-the-time one.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      transport: http
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

fondaria:
  demo-clock:
    # Task D.1. DEMO_CLOCK_ENABLED must never be set in production -- unset,
    # this service never reads reference.demo_clock at all. The local Kustomize
    # overlay is the only place that sets it to "true".
    enabled: ${DEMO_CLOCK_ENABLED:false}

  database:
    # No defaults. Production must fail to start when a required secret is
    # absent (AGENTS.md §4); the local-dev values live in
    # infrastructure/compose/.env.example.
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    connect-timeout: ${POSTGRES_CONNECT_TIMEOUT:5s}
    max-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}

  object-store:
    # Valuation files. A separate bucket from the contribution one: different
    # producers, different retention, different access — sharing one would mean a
    # credential scoped to valuations could list employers' payroll files.
    endpoint: ${OBJECT_STORE_ENDPOINT:}
    access-key: ${OBJECT_STORE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORE_SECRET_KEY:}
    region: ${OBJECT_STORE_REGION:us-east-1}
    bucket: ${VALUATION_FILE_BUCKET:}
    # A presigned URL is a write grant. Short-lived on purpose.
    upload-url-ttl: ${VALUATION_UPLOAD_URL_TTL:15m}
    # Far smaller than the contribution limit: a valuation file is one row per
    # fund per date. Never unbounded, because the size is chosen by the caller.
    maximum-object-bytes: ${VALUATION_FILE_MAX_BYTES:4194304}
    call-timeout: ${OBJECT_STORE_CALL_TIMEOUT:10s}

  calendar:
    # Task 7.1's BusinessCalendar. The holiday list is a STOPGAP: Task 7.1 specifies
    # Mexican banking and market holidays as effective-dated reference data, and that
    # table does not exist yet. Until it does, an empty list means weekends are the
    # only non-business dates — see CalendarProperties.
    zone: ${CALENDAR_ZONE:America/Mexico_City}
    cutoff-time: ${CALENDAR_CUTOFF_TIME:18:00}
    holidays: ${CALENDAR_HOLIDAYS:}

  identity:
    # Must be the identical value contribution-api uses — account ids are derived
    # deterministically from it (Task 20.4's strike reads UNITS_IN_ISSUE through it). See
    # IdentityProperties.
    ledger-namespace: ${LEDGER_ID_NAMESPACE:}

  ledger:
    # No default. Absence is a startup failure naming the variable. The local-dev value is
    # documented in infrastructure/compose/.env.example, shared with contribution-api — both
    # services must resolve to the same TigerBeetle cluster.
    addresses: ${TIGERBEETLE_ADDRESSES:}
    connect-timeout: ${TIGERBEETLE_CONNECT_TIMEOUT:1s}
    client:
      # No default: defaulting to cluster 0 would silently address whichever cluster happens
      # to have been formatted with that id.
      cluster-id: ${TIGERBEETLE_CLUSTER_ID:}
      cluster-name: ${LEDGER_CLUSTER_NAME:primary}
      call-timeout: ${TIGERBEETLE_CALL_TIMEOUT:5s}

  valuation-ingestion:
    # Operational tuning, not secrets: every value has a working default, and a
    # deployment that sets none of them ingests correctly on this cadence.
    poll-interval: ${VALUATION_POLL_INTERVAL:5s}
    batch-size: ${VALUATION_BATCH_SIZE:10}
    # How long a batch may sit in VALIDATING before another sweep may reclaim it.
    stale-after: ${VALUATION_STALE_AFTER:10m}
    # How far back the ageing report looks, and how late a valuation must be before
    # it is logged as a warning. One business date late is normal — a provider
    # delivering this morning's file this afternoon is not an incident.
    ageing-window-business-dates: ${VALUATION_AGEING_WINDOW_BUSINESS_DATES:30}
    ageing-alert-business-dates: ${VALUATION_AGEING_ALERT_BUSINESS_DATES:2}
    ageing-alert-interval: ${VALUATION_AGEING_ALERT_INTERVAL:15m}

  nav-cache:
    # Redis here is a warm-start convenience only, never authoritative, so an
    # empty URL is a supported configuration rather than a startup failure: the
    # cache reads reference.fund_nav instead. This is the opposite of
    # contribution-api's fondaria.cache, where Redis backs cash-receipt idempotency
    # replay and absence must refuse to start.
    url: ${NAV_CACHE_REDIS_URL:}
    password: ${NAV_CACHE_REDIS_PASSWORD:}
    command-timeout: ${NAV_CACHE_REDIS_COMMAND_TIMEOUT:1s}
    # How long an instance may go before it picks up a price struck by another
    # instance — the bound Task 20.6 means by "the documented interval". The
    # instance that struck the price refreshes that fund immediately.
    refresh-interval: ${NAV_CACHE_REFRESH_INTERVAL:10s}
    # How old a published price may be before it is served marked stale. Over 24
    # hours because NAV is daily (O-21): yesterday's price on a normal morning is
    # expected, a provider quiet for more than a day is not.
    stale-after: ${NAV_CACHE_STALE_AFTER:26h}
