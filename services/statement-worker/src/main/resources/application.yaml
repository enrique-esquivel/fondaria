spring:
  application:
    name: statement-worker
  threads:
    virtual:
      enabled: true
  flyway:
    # The shared migration tree in libs/db-migrations (ADR-0011's four schemas are one
    # database, not one per service). workflow.statement_run (V30) is added there.
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

  rabbitmq:
    host: ${STATEMENT_AMQP_HOST:}
    port: ${STATEMENT_AMQP_PORT:5672}
    username: ${STATEMENT_AMQP_USERNAME:}
    password: ${STATEMENT_AMQP_PASSWORD:}
    virtual-host: ${STATEMENT_AMQP_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    observation-enabled: true

server:
  # Must resolve to a writable path: the container runs with a read-only root filesystem
  # and only /tmp is mounted writable.
  tomcat:
    basedir: ${TOMCAT_BASEDIR:/tmp/statement-worker}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        # `demoClock` alone, `show-details` overridden back on for this group only -- see
        # contribution-api's application.yaml for the full rationale (Task D.2).
        demo:
          include: demoClock
          show-details: always
          show-components: always

  opentelemetry:
    resource-attributes:
      # Row 26n (as projection-worker, ADR-0032 §4): the Collector's Prometheus exporter turns
      # service.instance.id into the `instance` label. Without it every replica's counters are one
      # series the pods overwrite, and rate()/increase() read each swing as a counter reset.
      "[service.instance.id]": ${HOSTNAME:local}

  # Task 11.2: real spans and domain metrics to the OTel Collector (Task 11.1).
  # This service never names Prometheus, Tempo or Loki directly -- the
  # Collector is the only address configured (Task 11.1's own acceptance
  # criterion).
  tracing:
    sampling:
      # Every span is exported, not a probabilistic sample. Task 11.2's
      # acceptance criteria ("every ledger call is a span", "a single trace
      # spans HTTP -> ledger -> CDC -> projection") need the trace that
      # actually happened, not a 10%-of-the-time one.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      transport: http
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

fondaria:
  demo-clock:
    # Task D.1. DEMO_CLOCK_ENABLED must never be set in production -- unset,
    # this service never reads reference.demo_clock at all. The local Kustomize
    # overlay is the only place that sets it to "true".
    enabled: ${DEMO_CLOCK_ENABLED:false}

  database:
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    connect-timeout: ${POSTGRES_CONNECT_TIMEOUT:5s}
    max-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}

  statement:
    # Task 7.5b, ADR-0022. Mirrors spring.rabbitmq.addresses above so its absence is a named
    # startup failure (StatementProperties#requireComplete).
    amqp-host: ${STATEMENT_AMQP_HOST:}
    worker-concurrency: ${STATEMENT_WORKER_CONCURRENCY:6}
    publish-confirm-timeout: ${STATEMENT_PUBLISH_CONFIRM_TIMEOUT:60s}
    settlement-sweep-interval: ${STATEMENT_SETTLEMENT_SWEEP_INTERVAL:5s}

  statement-redis:
    # The completion counter's own Redis connection (ADR-0022 §3) — separate variables from
    # REDIS_URL (cash-receipt idempotency) and NAV_CACHE_REDIS_URL (the NAV warm start):
    # a different producer, a different key space, a different service.
    url: ${STATEMENT_REDIS_URL:}
    password: ${STATEMENT_REDIS_PASSWORD:}
    command-timeout: ${STATEMENT_REDIS_COMMAND_TIMEOUT:1s}
    counter-ttl: ${STATEMENT_COUNTER_TTL:45d}

  statement-object-store:
    # No defaults for the secrets (AGENTS.md §4). The same object store every other service reads;
    # only the buckets differ.
    endpoint: ${OBJECT_STORE_ENDPOINT:}
    access-key: ${OBJECT_STORE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORE_SECRET_KEY:}
    region: ${OBJECT_STORE_REGION:us-east-1}
    # Read-only: the bucket eod-job's dense snapshot (Task 7.4) writes to.
    snapshot-bucket: ${SNAPSHOT_BUCKET:}
    # Write-only: this service's own bucket for rendered statements.
    statement-bucket: ${STATEMENT_BUCKET:}
    call-timeout: ${STATEMENT_OBJECT_STORE_CALL_TIMEOUT:5m}
